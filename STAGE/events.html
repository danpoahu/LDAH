  <style>
    /* Loading state */
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60vh;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 78, 124, 0.2);
      border-top-color: #004E7C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Agenda events list (v48.3.0 redesign) ===== */
    .ev-month{padding:16px 4px 10px;}
    .ev-month span{font-size:13px;font-weight:800;color:#004E7C;letter-spacing:1px;text-transform:uppercase;}
    .ev-month .ev-ln{height:2px;background:linear-gradient(90deg,#0D7A7A,transparent);border-radius:2px;margin-top:5px;}
    .ev-card{background:transparent;border:1.5px solid rgba(0,78,124,.28);border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px rgba(15,23,42,.05);}
    .ev-row{display:flex;align-items:stretch;border-bottom:1px solid #E2E8F0;}
    .ev-row:last-child{border-bottom:0;}
    .ev-tile{flex:0 0 66px;background:linear-gradient(160deg,#004E7C,#0D7A7A);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 4px;text-align:center;}
    .ev-tile .ev-mo{font-size:11px;font-weight:800;letter-spacing:1px;opacity:.92;}
    .ev-tile .ev-dy{font-size:25px;font-weight:800;line-height:1;margin-top:2px;}
    .ev-tile.ev-ong{background:linear-gradient(160deg,#0D7A7A,#0891B2);}
    .ev-tile.ev-ong .ev-dy{font-size:14px;line-height:1.15;margin-top:4px;}
    .ev-tile.ev-flyer{background:linear-gradient(160deg,#b8860b,#FBBF24);color:#3b2f00;}
    .ev-tile.ev-flyer .ev-dy{font-size:13px;margin-top:3px;}
    .ev-body{flex:1;padding:13px 6px 13px 14px;min-width:0;cursor:pointer;}
    .ev-title{font-size:15.5px;font-weight:800;color:#004E7C;line-height:1.25;margin:0 0 7px;}
    .ev-line{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#475569;font-weight:600;margin-top:3px;}
    .ev-line svg{flex:0 0 auto;}
    .ev-vpill{font-size:10.5px;font-weight:800;color:#0891B2;background:#E0F2FE;padding:1px 7px;border-radius:999px;margin-left:2px;}
    .ev-flyerlink{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:12.5px;font-weight:700;color:#0066a1;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;}
    .ev-flyerlink:hover{text-decoration:underline;}
    .ev-aside{flex:0 0 auto;display:flex;align-items:center;padding:0 12px;}
    .ev-signup{border:0;background:linear-gradient(135deg,#004E7C,#0D7A7A);color:#fff;font-weight:800;font-size:12.5px;padding:10px 15px;border-radius:999px;cursor:pointer;box-shadow:0 2px 8px rgba(0,78,124,.25);font-family:inherit;}
    .ev-chevron{flex:0 0 auto;display:flex;align-items:center;padding-right:12px;color:#cbd5e1;cursor:pointer;}
    .ev-row.ev-expired{opacity:.55;}
    .ev-row.ev-expired .ev-title{text-decoration:line-through;}

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main id="main-content">

  <script type="text/babel">
    const { useState, useEffect } = React;

    // URL conversion function (global)
    const convertUrlsToLinks = (text) => {
      const urlRegex = /(https?:\/\/[^\s]+)|(www\.[^\s]+)/gi;
      const parts = text.split(urlRegex).filter(Boolean);
      
      return parts.map((part, index) => {
        if (part.match(urlRegex)) {
          let href = part;
          if (part.startsWith('www.')) {
            href = 'https://' + part;
          }
          return <a key={index} href={href} target="_blank" rel="noopener noreferrer" style={{color: '#0066a1', textDecoration: 'underline'}}>{part}</a>;
        }
        return part;
      });
    };

    // Icons
    const Menu = ({ size = 24, className = '' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    );

    const X = ({ size = 24, className = '' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );

    const ChevronLeft = ({ size = 24, className = '' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    );

    const Calendar = ({ size = 24, className = '' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    );

    const Clock = ({ size = 24, className = '' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    );

    // ── Recurring-event helpers (field names match CMS: frequency, numeric dayOfWeek, weekOfMonth)
    const fmt12 = (time24) => {
      if (!time24) return '';
      const [h, m] = time24.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const hour = h % 12 || 12;
      return `${hour}:${String(m).padStart(2,'0')} ${ampm}`;
    };

    const getOccurrencesInNext30Days = (schedules, cancelledDates) => {
      const today = new Date(); today.setHours(0,0,0,0);
      const end = new Date(today); end.setDate(end.getDate() + 30);
      // cancelledDates entries are either "YYYY-MM-DD" strings or { date: "YYYY-MM-DD", ... }
      const cancelledSet = new Set((cancelledDates || []).map(cd => cd.date || cd));
      const results = [];
      (schedules || []).forEach(sch => {
        if (sch.frequency === 'weekly') {
          let d = new Date(today);
          const diff = (sch.dayOfWeek - d.getDay() + 7) % 7;
          d.setDate(d.getDate() + diff);
          while (d <= end) {
            if (!cancelledSet.has(d.toISOString().slice(0, 10))) {
              results.push({ date: new Date(d), schedule: sch });
            }
            d.setDate(d.getDate() + 7);
          }
        } else { // monthly
          for (let mo = 0; mo <= 2; mo++) {
            const ref = new Date(today.getFullYear(), today.getMonth() + mo, 1);
            const firstDow = ref.getDay();
            const dayOffset = (sch.dayOfWeek - firstDow + 7) % 7;
            const nth = new Date(ref.getFullYear(), ref.getMonth(),
                                 1 + dayOffset + (sch.weekOfMonth - 1) * 7);
            if (nth.getMonth() === ref.getMonth() && nth >= today && nth <= end && !cancelledSet.has(nth.toISOString().slice(0, 10)))
              results.push({ date: nth, schedule: sch });
          }
        }
      });
      results.sort((a, b) => a.date - b.date);
      return results;
    };

    const formatOccurrence = (occ) => {
      const d = occ.date;
      const label = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
      const venue = occ.schedule.venue ? ` \u2013 ${occ.schedule.venue}` : '';
      const timeRange = `${fmt12(occ.schedule.startTime)} \u2013 ${fmt12(occ.schedule.endTime)}`;
      const key = `${d.toISOString().slice(0,10)}|${occ.schedule.location}${venue}|${timeRange}`;
      const display = `${label} \u00b7 ${occ.schedule.location}${venue} \u00b7 ${timeRange}`;
      return { key, display };
    };

    // Render the recurring pattern of a single schedule entry — used on the
    // events-list card so users see the actual cadence (e.g. "2nd Thursdays")
    // rather than just the next computed occurrence.
    const DOW_PLURAL = ['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
    const DOW_SINGULAR = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const ORDINAL = ['', '1st', '2nd', '3rd', '4th', '5th'];
    const formatScheduleLine = (sch) => {
      if (sch == null || typeof sch.dayOfWeek !== 'number') return null;
      const time = `${fmt12(sch.startTime)} – ${fmt12(sch.endTime)}`;
      const where = sch.venue ? `${sch.location} – ${sch.venue}` : (sch.location || '');
      let when;
      if (sch.frequency === 'weekly') {
        when = DOW_PLURAL[sch.dayOfWeek] || '';
      } else {
        const ord = ORDINAL[sch.weekOfMonth] || '';
        when = ord ? `${ord} ${DOW_SINGULAR[sch.dayOfWeek]}` : DOW_SINGULAR[sch.dayOfWeek];
      }
      return { when, time, where };
    };
    // ────────────────────────────────────────────────────────────────────────

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAU3CQ07bCVKlJ1qGak-150kaJEyPKldLk",
      authDomain: "ldah-932d5.firebaseapp.com",
      projectId: "ldah-932d5",
      storageBucket: "ldah-932d5.firebasestorage.app",
      messagingSenderId: "662130454003",
      appId: "1:662130454003:web:437576d5a5811ecd8df686"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();
    const auth = firebase.auth();

    // Signup source attribution: the registration email flow sets its own
    // signupSource; for everything else derive it from the ?src= URL param
    // (popup -> event-popup, home/home-hero -> home-hero) and default to
    // 'direct' so no signup is left unattributed. Mirrors LDAH_W2 events.html.
    function _resolveSignupSource() {
      try {
        var s = (new URLSearchParams(window.location.search).get('src') || '').trim().toLowerCase();
        if (s === 'popup') return 'event-popup';
        if (s === 'home' || s === 'home-hero') return 'home-hero';
        if (s) return s.replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'direct';
        return 'direct';
      } catch (e) { return 'direct'; }
    }

    auth.signInAnonymously().catch(error => {
      console.error('Anonymous auth failed:', error);
    });

    // Track page view
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          await db.collection('analytics').add({
            eventType: 'page_view',
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            page: window.location.pathname,
            page_title: document.title
          });
        } catch (error) {
          console.error('Page view tracking error:', error);
        }
      }
    });

    // Mirror of LDAH_W2 parseSignupDateString — converts a free-form signup
    // date label (e.g. "October 11, 2025" or "October 11th") into YYYY-MM-DD,
    // so we can detect expired dates on the signup modal.
    function parseSignupDateString(dateStr) {
      if (!dateStr) return null;
      const months = {
        january:0,february:1,march:2,april:3,may:4,june:5,
        july:6,august:7,september:8,october:9,november:10,december:11
      };
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();
      const monthDayMatch = dateStr.match(/\b(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})(?:st|nd|rd|th)?\b/i);
      if (monthDayMatch) {
        const monthNum = months[monthDayMatch[1].toLowerCase()];
        const day = parseInt(monthDayMatch[2], 10);
        if (monthNum !== undefined && day >= 1 && day <= 31) {
          const yearMatch = dateStr.match(/\b(20\d{2})\b/);
          let year = yearMatch ? parseInt(yearMatch[1],10) : (monthNum < currentMonth ? currentYear + 1 : currentYear);
          return `${year}-${String(monthNum+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        }
      }
      try {
        const clean = dateStr.replace(/^[A-Za-z']+[.,]\s*/i,'').replace(/\d{1,2}(?:am|pm)\s*-\s*\d{1,2}(?:am|pm)/i,'').replace(/\*\*.*?\*\*/g,'').trim();
        const parsed = new Date(clean);
        if (!isNaN(parsed.getTime())) {
          return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,'0')}-${String(parsed.getDate()).padStart(2,'0')}`;
        }
      } catch(_) {}
      return null;
    }

    function isSignupDateExpired(dateStr) {
      const iso = parseSignupDateString(dateStr);
      if (!iso) return false;
      return new Date(iso + 'T23:59:59') < new Date();
    }

    // Split a free-form signupDate string into a tidy { when, time, expired } row
    // for display on the events list card. Falls back to the raw string if parse fails.
    const formatSignupDateRow = (dateStr) => {
      if (!dateStr) return null;
      const iso = parseSignupDateString(dateStr);
      let when = dateStr;
      let time = '';
      if (iso) {
        const d = new Date(iso + 'T00:00:00');
        when = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
      }
      const timeMatch = dateStr.match(/(\d{1,2}(?::\d{2})?\s*(?:am|pm)\s*[-–]\s*\d{1,2}(?::\d{2})?\s*(?:am|pm))/i);
      if (timeMatch) {
        time = timeMatch[1]
          .replace(/\s*-\s*/g, ' – ')
          .replace(/\s+/g, ' ')
          .replace(/(\d)\s*(am|pm)/gi, (_, d, ap) => `${d} ${ap.toUpperCase()}`);
      }
      const expired = iso ? new Date(iso + 'T23:59:59') < new Date() : false;
      return { when, time, expired };
    };

    // ===== Agenda (events list) helpers — v48.3.0 redesign =====
    const DOW_ABBR = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const ORDINAL_ABBR = { 1: '1ST', 2: '2ND', 3: '3RD', 4: '4TH', 5: '5TH' };
    const evLooksVirtual = (s) => !!(s && /\b(online|virtual|zoom|facebook|fb|webinar|teams|google meet|livestream|live stream)\b/i.test(s));
    const evToIso = (v) => {
      if (!v) return null;
      let d = null;
      if (v instanceof Date) d = v;
      else if (typeof v === 'object' && typeof v.toDate === 'function') d = v.toDate(); // Firestore Timestamp
      else if (typeof v === 'string') {
        if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
        return parseSignupDateString(v);
      }
      if (d && !isNaN(d.getTime())) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      return null;
    };
    const evTileFromIso = (iso) => {
      if (!iso) return null;
      const d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return null;
      return { mo: d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase(), dy: String(d.getDate()) };
    };
    const evMonthLabel = (iso) => {
      if (!iso) return '';
      const d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    };
    // "June 10, 2026 - Navigating Transitions - 5:00 PM" -> "Navigating Transitions"
    const evSessionLabel = (ds) => {
      if (!ds) return '';
      const rem = ds
        .replace(/(\d{1,2}(?::\d{2})?\s*(?:am|pm)\s*[-–]\s*\d{1,2}(?::\d{2})?\s*(?:am|pm))/i, '')
        .replace(/\b\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/i, '');
      const parts = rem.split(/\s*[-–]\s*/).map(p => p.trim()).filter(Boolean);
      if (parts.length <= 1) return '';
      return parts.slice(1).join(' · ').replace(/[,\s]+$/, '').trim();
    };

    const EventsApp = () => {
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPastEvents, setIsPastEvents] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [showSignupModal, setShowSignupModal] = useState(false);
      const [signupEvent, setSignupEvent] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        phone: '',
        registrantType: '',
        preferredContact: '',
        participationType: '',
        groupName: '',
        groupSize: '',
        selectedDates: [],
        customAnswers: {},
        additionalComments: '',
        // Inline registration fields for non-Parent/Guardian roles (v48.0.0)
        streetAddress: '',
        city: '',
        zipCode: '',
        reasonForAttending: '',
        priorTraining: '',
        priorTrainingDate: '',
        howHeard: '',
        howHeardOther: '',
        accommodations: ''
      });
      const [submitting, setSubmitting] = useState(false);
      const [submitSuccess, setSubmitSuccess] = useState(false);
      const [lastSignupDocId, setLastSignupDocId] = useState(null);
      const [lastSignupEventId, setLastSignupEventId] = useState(null);
      const [lastSignupType, setLastSignupType] = useState(null); // 'event' or 'recurring'
      const [lastSignupWasInlineReg, setLastSignupWasInlineReg] = useState(false); // v48.0.0

      // Second parent / guardian (optional). Shared across the one-time and
      // recurring signup forms (only one modal is open at a time).
      const [showSecondParent, setShowSecondParent] = useState(false);
      const [secondParent, setSecondParent] = useState({ firstName: '', lastName: '', email: '' });
      const collectSecondParent = () => {
        const em = (secondParent.email || '').trim();
        if (!em) return null;
        return { firstName: (secondParent.firstName || '').trim(), lastName: (secondParent.lastName || '').trim(), email: em };
      };

      // Email-blur prefill banner (v48.0.0)
      const [emailPrefillBanner, setEmailPrefillBanner] = useState(null); // null | {firstName}
      const [emailPrefillDismissed, setEmailPrefillDismissed] = useState(false);

      // Helper: does this role need the separate registration step?
      const roleNeedsRegistration = (role) => role === 'Parent/Guardian';

      // Email onBlur handler: silent lookup via getContactForPrefill?email=...
      const handleEmailBlur = async () => {
        const email = (formData.email || '').trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return;
        try {
          const resp = await fetch(
            'https://us-central1-ldah-932d5.cloudfunctions.net/getContactForPrefill?email=' +
            encodeURIComponent(email.toLowerCase()),
            { method: 'GET' }
          );
          if (!resp.ok) return; // 404 = no match — silent
          const c = await resp.json();
          // Pre-fill only empty/untouched fields; never override role
          setFormData(prev => ({
            ...prev,
            name: prev.name.trim() ? prev.name : ((c.displayName || [c.firstName, c.lastName].filter(Boolean).join(' ') || '').trim() || prev.name),
            phone: prev.phone.trim() ? prev.phone : (c.phone || prev.phone),
            streetAddress: prev.streetAddress.trim() ? prev.streetAddress : (c.streetAddress || prev.streetAddress),
            city: prev.city.trim() ? prev.city : (c.city || prev.city),
            zipCode: prev.zipCode.trim() ? prev.zipCode : (c.zipCode || prev.zipCode),
            reasonForAttending: prev.reasonForAttending ? prev.reasonForAttending : (c.reasonForAttending || prev.reasonForAttending),
            priorTraining: prev.priorTraining ? prev.priorTraining : (c.priorTraining || prev.priorTraining),
            priorTrainingDate: prev.priorTrainingDate ? prev.priorTrainingDate : (c.priorTrainingDate || prev.priorTrainingDate),
            howHeard: prev.howHeard ? prev.howHeard : (c.howHeard || prev.howHeard),
            howHeardOther: prev.howHeardOther.trim() ? prev.howHeardOther : (c.howHeardOther || prev.howHeardOther),
            accommodations: prev.accommodations.trim() ? prev.accommodations : (c.accommodations || prev.accommodations),
          }));
          const firstName = c.firstName || (c.displayName || '').split(' ')[0] || '';
          if (firstName) {
            setEmailPrefillBanner({ firstName });
            setEmailPrefillDismissed(false);
          }
        } catch (_) { /* silent on CF failure */ }
      };

      // Pre-fill OTP-by-email state (B'' flow — see W2 events.html for the
      // canonical implementation. Same Cloud Function endpoints, same UX.)
      const [prefillModalOpen, setPrefillModalOpen] = useState(false);
      const [prefillCode, setPrefillCode] = useState('');
      const [prefillError, setPrefillError] = useState('');
      const [prefillBusy, setPrefillBusy] = useState(false);
      const [prefillApplied, setPrefillApplied] = useState(false);
      const [prefillStash, setPrefillStash] = useState(null); // demographics for stage 2

      const requestPrefillCode = async () => {
        const email = (formData.email || '').trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          alert('Please enter your email address above first, then tap "Pre-fill from email".');
          return;
        }
        setPrefillBusy(true);
        try {
          await fetch('https://us-central1-ldah-932d5.cloudfunctions.net/requestPrefillCode', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
        } catch (_) { /* swallow — modal still opens */ }
        setPrefillBusy(false);
        setPrefillCode('');
        setPrefillError('');
        setPrefillModalOpen(true);
      };

      const verifyPrefillCode = async () => {
        const code = (prefillCode || '').trim();
        if (!/^\d{6}$/.test(code)) { setPrefillError('Please enter the 6-digit code.'); return; }
        setPrefillBusy(true); setPrefillError('');
        try {
          const resp = await fetch('https://us-central1-ldah-932d5.cloudfunctions.net/verifyPrefillCodeAndPrefill', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: (formData.email || '').trim(), code }),
          });
          const result = await resp.json();
          if (!resp.ok || !result.ok) {
            setPrefillError(result.error || 'Verification failed. Please try again.');
            setPrefillBusy(false);
            return;
          }
          const pf = result.prefill || {};
          setFormData(prev => ({
            ...prev,
            name: pf.displayName || ((pf.firstName || '') + ' ' + (pf.lastName || '')).trim() || prev.name,
            phone: pf.phone || prev.phone,
          }));
          // Stash demographics for stage 2 (registration form)
          setPrefillStash({
            streetAddress: pf.streetAddress || '',
            city: pf.city || '',
            zipCode: pf.zipCode || '',
            militaryStatus: pf.militaryStatus || '',
            militaryBranch: pf.militaryBranch || '',
            ethnicity: pf.ethnicity || '',
            priorTraining: pf.priorTraining || '',
            priorTrainingDate: pf.priorTrainingDate || '',
            howHeard: pf.howHeard || '',
            accommodations: pf.accommodations || '',
            childName: (pf.children && pf.children[0] && pf.children[0].name) || '',
            childAgeRange: (pf.children && pf.children[0] && pf.children[0].ageRange) || '',
            childGender: (pf.children && pf.children[0] && pf.children[0].gender) || '',
            disabilityCategories: (pf.children && pf.children[0] && pf.children[0].disabilityCategories) || [],
          });
          setPrefillApplied(true);
          setPrefillBusy(false);
          setPrefillModalOpen(false);
        } catch (err) {
          setPrefillError('Network error. Please try again.');
          setPrefillBusy(false);
        }
      };

      // Recurring-event state
      const [recurringPrograms, setRecurringPrograms] = useState([]);
      const [showRecurringModal, setShowRecurringModal] = useState(false);
      const [recurringSignupEvent, setRecurringSignupEvent] = useState(null);
      const [recurringFormData, setRecurringFormData] = useState({
        name: '', email: '', phone: '', preferredContact: '',
        registrantType: '',
        // DOB is captured as three parts so partial selections persist; dob
        // (YYYY-MM-DD) is recomputed whenever all three are set + valid.
        studentName: '', dob: '', dobMonth: '', dobDay: '', dobYear: '', studentId: '', grade: '',
        currentSchool: '', iepReviewDate: '', reevDate: '', careCoordinator: '',
        participationType: 'Individual', groupName: '', groupSize: '',
        selectedSessions: [], additionalComments: '',
        multipleSessionsReason: '',
        priorConnectGen: ''
      });
      const [recurringSubmitting, setRecurringSubmitting] = useState(false);
      const [recurringSubmitSuccess, setRecurringSubmitSuccess] = useState(false);
      const [recurringLastSignupDocId, setRecurringLastSignupDocId] = useState(null);
      const [sessionConfirmedCounts, setSessionConfirmedCounts] = useState({});
      const RECURRING_SESSION_CAPACITY = 3;

      // Registration modal state
      const [showRegistrationModal, setShowRegistrationModal] = useState(false);
      const [regToken, setRegToken] = useState(null);
      const [regEventId, setRegEventId] = useState(null);
      const [regType, setRegType] = useState(null); // 'event' or 'recurring'
      const [regPrefillData, setRegPrefillData] = useState(null);
      const [regLoading, setRegLoading] = useState(false);
      const [regSubmitting, setRegSubmitting] = useState(false);
      const [regSuccess, setRegSuccess] = useState(false);
      const [regAlreadyCompleted, setRegAlreadyCompleted] = useState(false);
      const [regError, setRegError] = useState(null);
      const [regRegistrantName, setRegRegistrantName] = useState('');
      const [regSignupInfo, setRegSignupInfo] = useState(null); // {name, email, phone, selectedDates}
      const [regLastRegistration, setRegLastRegistration] = useState(null);
      const [regSiblingDraft, setRegSiblingDraft] = useState(null); // {name, email, phone, selectedDates, eventId, type, collectionName}
      const [regFormData, setRegFormData] = useState({
        streetAddress: '', city: '', zipCode: '',
        role: '', reasonForAttending: '',
        militaryStatus: '', militaryBranch: '',
        childName: '', childAgeRange: '', childGender: '', ethnicity: '',
        disabilityCategories: [],
        priorTraining: '', priorTrainingDate: '',
        howHeard: '', howHeardOther: '', accommodations: ''
      });
      const [regDisabilityError, setRegDisabilityError] = useState(false);
      // Sibling-signup prompt state
      const [regSiblings, setRegSiblings] = useState([]); // [{collection, eventId, signupId, eventTitle, sessionDate}]
      const [regSiblingChecked, setRegSiblingChecked] = useState({});
      const [regSiblingApplying, setRegSiblingApplying] = useState(false);
      const [regSiblingApplied, setRegSiblingApplied] = useState(0); // >0 means applied to N
      const [regSiblingDismissed, setRegSiblingDismissed] = useState(false);

      // ── Registration modal helpers ──────────────────────────────────────
      const openRegistration = async (token, eventId, type, prefill, siblingDraft) => {
        setRegToken(token);
        setRegEventId(eventId);
        setRegType(type);
        setRegPrefillData(prefill || null);
        setRegSuccess(false);
        setRegAlreadyCompleted(false);
        setRegError(null);
        setRegDisabilityError(false);
        setRegSubmitting(false);
        setRegSiblings([]);
        setRegSiblingChecked({});
        setRegSiblingApplied(0);
        setRegSiblingDismissed(false);
        // Clear any stale sibling draft unless this call is opening in draft mode
        if (token !== '__SIBLING_DRAFT__') setRegSiblingDraft(null);
        setShowRegistrationModal(true);
        setRegLoading(true);

        // Reset form with optional prefill
        const pf = prefill || {};
        setRegFormData({
          streetAddress: pf.streetAddress || '',
          city: pf.city || '',
          zipCode: pf.zipCode || '',
          role: pf.role || '',
          reasonForAttending: pf.reasonForAttending || '',
          militaryStatus: pf.militaryStatus || '',
          militaryBranch: pf.militaryBranch || '',
          childName: pf.childName || '',
          childAgeRange: pf.childAgeRange || '',
          childGender: pf.childGender || '',
          ethnicity: pf.ethnicity || '',
          disabilityCategories: Array.isArray(pf.disabilityCategories) ? pf.disabilityCategories : [],
          priorTraining: pf.priorTraining || '',
          priorTrainingDate: pf.priorTrainingDate || '',
          howHeard: pf.howHeard || '',
          howHeardOther: pf.howHeardOther || '',
          accommodations: pf.accommodations || ''
        });

        // Sibling draft mode — no Firestore doc yet. Skip fetch and show form directly.
        if (token === '__SIBLING_DRAFT__') {
          const draft = siblingDraft || {};
          setRegSignupInfo({
            name: draft.name || '',
            email: draft.email || '',
            phone: draft.phone || '',
            selectedDates: Array.isArray(draft.selectedDates) ? draft.selectedDates.slice() : []
          });
          setRegRegistrantName(draft.name || 'Attendee');
          setRegLoading(false);
          return;
        }

        // Fetch signup doc
        try {
          const collectionName = type === 'recurring' ? 'recurringEvents' : 'events';
          const doc = await db.collection(collectionName).doc(eventId).collection('signups').doc(token).get();
          if (!doc.exists) {
            setRegError('Registration not found. Please check your link and try again.');
            setRegLoading(false);
            return;
          }
          const data = doc.data();
          setRegSignupInfo({ name: data.name || '', email: data.email || '', phone: data.phone || '', selectedDates: Array.isArray(data.selectedDates) ? data.selectedDates.slice() : [] });
          setRegRegistrantName(data.name || 'Attendee');

          // Bridge the role captured at signup into the registration form so we
          // don't re-ask "About You" (v47.11). Drives the Parent/Guardian gating.
          // Also bridge the child/student name so registration doesn't re-ask
          // it (v47.13) — CG signup collects studentName inline.
          var signupRole = data.role || data.registrantType || '';
          var signupChildName = data.studentName || '';
          if (signupRole || signupChildName) {
            setRegFormData(prev => ({
              ...prev,
              role: signupRole || prev.role,
              childName: signupChildName || prev.childName
            }));
          }

          if (data.status === 'confirmed') {
            setRegAlreadyCompleted(true);
          }
        } catch (err) {
          console.error('Error loading registration:', err);
          setRegError('Error loading registration. Please try again later.');
        } finally {
          setRegLoading(false);
        }
      };

      const handleRegFormChange = (field, value) => {
        setRegFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleDisabilityToggle = (dis) => {
        setRegFormData(prev => ({
          ...prev,
          disabilityCategories: prev.disabilityCategories.includes(dis)
            ? prev.disabilityCategories.filter(d => d !== dis)
            : [...prev.disabilityCategories, dis]
        }));
        setRegDisabilityError(false);
      };

      const handleRegSubmit = async (e) => {
        e.preventDefault();
        // Double-submit guard (2026-07-07): lock synchronously before any await
        // (a rapid second tap during the async write was creating duplicate
        // registrations); the finally below always releases it, with a 20s
        // safety-net timer.
        if (window.__ldahLock_appReg) return;
        window.__ldahLock_appReg = true;
        var __unlockTimer;
        var __unlock = function () { clearTimeout(__unlockTimer); window.__ldahLock_appReg = false; };
        __unlockTimer = setTimeout(__unlock, 20000);
        try {
        // Validate disability checkboxes (Parent/Guardian only)
        if (regFormData.role === 'Parent/Guardian' && regFormData.disabilityCategories.length === 0) {
          setRegDisabilityError(true);
          return;
        }
        setRegSubmitting(true);
        try {
          const collectionName = regType === 'recurring' ? 'recurringEvents' : 'events';
          const registration = { ...regFormData };
          // Sanitize child/military fields for non-parent registrants
          if (registration.role !== 'Parent/Guardian') {
            registration.militaryStatus = '';
            registration.militaryBranch = '';
            registration.childName = '';
            registration.childAgeRange = '';
            registration.childGender = '';
            registration.ethnicity = '';
            registration.disabilityCategories = [];
          }

          // Second parent / guardian (optional): the signup-form inputs are no
          // longer mounted at this registration step, so bridge via the draft.
          const _sp = window._secondParentDraft || null;
          if (_sp) registration.secondParent = _sp;

          // Sibling draft path — create a fully-formed confirmed signup now (no pending write, no email).
          let effectiveToken = regToken;
          if (regSiblingDraft) {
            const draft = regSiblingDraft;
            // Same-child guard (2026-07-07): if the "another child" is the one just
            // registered, confirm before adding — stops accidental same-child
            // duplicates from the "Register Another Child" button.
            const _prevChild = ((regLastRegistration || {}).childName || '').trim().toLowerCase();
            const _newChild = ((registration || {}).childName || '').trim().toLowerCase();
            if (_prevChild && _newChild && _prevChild === _newChild) {
              if (!window.confirm('It looks like ' + (registration.childName || 'this child') + ' is already registered for this event. Add them again anyway?')) {
                return; // finally blocks below release submitting + the lock
              }
            }
            const newDocRef = await db.collection(collectionName).doc(regEventId).collection('signups').add({
              name: draft.name || '',
              email: draft.email || '',
              phone: draft.phone || '',
              selectedDates: Array.isArray(draft.selectedDates) ? draft.selectedDates : [],
              status: 'confirmed',
              registration: registration,
              ...(_sp ? { secondParent: _sp } : {}),
              registrantType: registration.role || '',
              // Sibling draft was opened from a registration-token email link
              signupSource: 'registration-email',
              registrationCompletedAt: firebase.firestore.FieldValue.serverTimestamp(),
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            // Update denormalized counts (best-effort — CF will also reconcile)
            try {
              await db.collection(collectionName).doc(regEventId).update({
                signupCount: firebase.firestore.FieldValue.increment(1)
              });
            } catch (countErr) {
              console.warn('Count update deferred to Cloud Function:', countErr.message);
            }
            effectiveToken = newDocRef.id;
            setRegToken(effectiveToken);
            setRegSiblingDraft(null);
          } else {
            await db.collection(collectionName).doc(regEventId).collection('signups').doc(regToken).update({
              registration: registration,
              ...(_sp ? { secondParent: _sp } : {}),
              registrantType: registration.role || '',
              status: 'confirmed',
              registrationCompletedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
          setRegLastRegistration({ ...regFormData });
          setRegSuccess(true);
          // Kick off sibling-signup lookup (non-blocking)
          (async () => {
            try {
              const resp = await fetch('https://us-central1-ldah-932d5.cloudfunctions.net/findSiblingPendingSignups', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ collection: collectionName, eventId: regEventId, signupId: effectiveToken })
              });
              if (!resp.ok) return;
              const data = await resp.json();
              const siblings = (data && data.siblings) || [];
              if (!siblings.length) return;
              const initChecked = {};
              siblings.forEach((_, i) => { initChecked[i] = true; });
              setRegSiblings(siblings);
              setRegSiblingChecked(initChecked);
            } catch (e) { console.warn('Sibling signup check skipped:', e.message); }
          })();
        } catch (err) {
          console.error('Error submitting registration:', err);
          setRegError('There was an error submitting your registration. Please try again later.');
        } finally {
          setRegSubmitting(false);
        }
        } finally { __unlock(); }
      };

      const handleApplySiblings = async () => {
        const reg = regLastRegistration;
        if (!reg || !regSiblings.length) return;
        const indices = Object.keys(regSiblingChecked).filter(k => regSiblingChecked[k]).map(Number);
        if (!indices.length) { setRegSiblingDismissed(true); return; }
        setRegSiblingApplying(true);
        try {
          const writes = indices.map(i => {
            const s = regSiblings[i];
            const _sp = window._secondParentDraft || null;
            return db.collection(s.collection).doc(s.eventId).collection('signups').doc(s.signupId).update({
              registration: (_sp ? { ...reg, secondParent: _sp } : reg),
              ...(_sp ? { secondParent: _sp } : {}),
              registrantType: reg.role || '',
              status: 'confirmed',
              registrationCompletedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          });
          await Promise.all(writes);
          setRegSiblingApplied(indices.length);
        } catch (err) {
          console.error('Error applying to siblings:', err);
          setRegSiblingApplied(-1);
        } finally {
          setRegSiblingApplying(false);
        }
      };

      const handleRegisterAnotherChild = () => {
        if (!regSignupInfo || !regEventId || !regType) return;
        // Defer Firestore write until the sibling's registration form is submitted.
        // Stash draft context — handleRegSubmit picks it up via regSiblingDraft state.
        const collectionName = regType === 'recurring' ? 'recurringEvents' : 'events';
        const draft = {
          name: regSignupInfo.name || '',
          email: regSignupInfo.email || '',
          phone: regSignupInfo.phone || '',
          selectedDates: Array.isArray(regSignupInfo.selectedDates) ? regSignupInfo.selectedDates.slice() : [],
          eventId: regEventId,
          type: regType,
          collectionName: collectionName
        };
        setRegSiblingDraft(draft);
        // Start the "another child" form with the CHILD fields blank (keep the
        // family info) — a pre-filled child was letting a careless submit create
        // a duplicate of the same child. (2026-07-07)
        const anotherChildPrefill = Object.assign({}, regLastRegistration || {}, {
          childName: '', childAgeRange: '', childGender: '', ethnicity: '', disabilityCategories: []
        });
        // Open the registration form in draft mode. The sentinel token matches W2's convention.
        openRegistration('__SIBLING_DRAFT__', regEventId, regType, anotherChildPrefill, draft);
      };

      // Auto-open registration from URL params (email links)
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const eventId = urlParams.get('eventId');
        const type = urlParams.get('type');
        if (token && eventId && type) {
          // Small delay to ensure Firebase is ready
          const timer = setTimeout(() => {
            openRegistration(token, eventId, type);
          }, 500);
          return () => clearTimeout(timer);
        }
      }, []);
      // ──────────────────────────────────────────────────────────────────────

      useEffect(() => {
        const load = async () => {
          try {
            const [eventsSnap, recurringSnap] = await Promise.all([
              db.collection('events').get(),
              db.collection('recurringEvents').get()   // fetch all, filter active client-side
            ]);
            const allRecurring = recurringSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            console.log('📊 Events:', eventsSnap.size, '| Recurring docs:', recurringSnap.size, allRecurring);
            setEvents(eventsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            // filter active client-side so a missing/false field doesn't silently hide programs
            setRecurringPrograms(allRecurring.filter(p => p.active !== false));
          } catch (error) {
            console.error('Error loading events:', error);
          } finally {
            setLoading(false);
          }
        };
        load();
      }, []);

      const formatDate = (dateString) => {
        if (!dateString) return '';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { 
          month: 'long', 
          day: 'numeric', 
          year: 'numeric' 
        });
      };

      const isEventCurrent = (event) => {
        const now = new Date();
        const startDate = new Date(event.startDate + 'T00:00:00');
        const moveToPastDate = new Date(event.moveToPastDate + 'T00:00:00');
        return now >= startDate && now < moveToPastDate;
      };

      const isEventPast = (event) => {
        const now = new Date();
        const moveToPastDate = new Date(event.moveToPastDate + 'T00:00:00');
        const removeDate = new Date(event.removeDate + 'T00:00:00');
        return now >= moveToPastDate && now < removeDate;
      };

      // Build virtual recurring cards — those with upcoming occurrences or flyer-only
      const recurringVirtualEvents = recurringPrograms
        .map(prog => {
          if (prog.flyerOnly) {
            return { ...prog, _isRecurring: true, _isFlyerOnly: true,
                     _nextDate: new Date(), _nextLabel: 'Informational' };
          }
          const occ = getOccurrencesInNext30Days(prog.schedules || [], prog.cancelledDates);
          if (!occ.length) return null;
          const { display } = formatOccurrence(occ[0]);
          return { ...prog, _isRecurring: true, _nextDate: occ[0].date,
                   _nextLabel: display, _occurrences: occ };
        })
        .filter(Boolean)
        .sort((a, b) => a._nextDate - b._nextDate);

      const regularCurrent = events.filter(isEventCurrent)
        .sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

      const _acceptsSignups = (ev) => {
        if (!ev) return false;
        if (ev._isFlyerOnly || ev.isFlyerOnly) return false;
        if (ev.infoOnly === true) return false;   // one-time flyer — never takes signups
        if (ev._isRecurring || ev.isRecurring) return true;
        return !!(ev.signupDates && ev.signupDates.length > 0);
      };
      // Order: one-time signup events (LL, PTC) → recurring programs (Connect-Gen) → info/flyers
      const _oneTimeSignup = regularCurrent.filter(_acceptsSignups);
      const _recurringSignup = recurringVirtualEvents.filter(_acceptsSignups);
      const _infoFlyers = [...regularCurrent, ...recurringVirtualEvents].filter(e => !_acceptsSignups(e));
      const currentEvents = [..._oneTimeSignup, ..._recurringSignup, ..._infoFlyers];

      const pastEvents = events.filter(isEventPast).sort((a, b) =>
        new Date(b.moveToPastDate) - new Date(a.moveToPastDate)
      );

      const activeEvents = isPastEvents ? pastEvents : currentEvents;

      const goToNext = () => {
        setCurrentIndex((prev) => (prev + 1) % activeEvents.length);
      };

      const goToPrev = () => {
        setCurrentIndex((prev) => (prev - 1 + activeEvents.length) % activeEvents.length);
      };

      const goToSlide = (index) => {
        setCurrentIndex(index);
      };

      const handleSignupClick = (event) => {
        // Auto-select when there's exactly one non-expired signup date so
        // we don't force the user to tick a single box.
        const allDates = event.signupDates || [];
        const availableDates = allDates.filter(d => !isSignupDateExpired(d));
        const preselected = availableDates.length === 1 ? [availableDates[0]] : [];

        setSignupEvent(event);
        setShowSignupModal(true);
        setFormData({
          name: '',
          email: '',
          phone: '',
          registrantType: '',
          preferredContact: '',
          participationType: '',
          groupName: '',
          groupSize: '',
          selectedDates: preselected,
          customAnswers: {},
          additionalComments: '',
          // Inline registration fields (v48.0.0)
          streetAddress: '',
          city: '',
          zipCode: '',
          reasonForAttending: '',
          priorTraining: '',
          priorTrainingDate: '',
          howHeard: '',
          howHeardOther: '',
          accommodations: ''
        });
        setSubmitSuccess(false);
        setLastSignupWasInlineReg(false);
        setEmailPrefillBanner(null);
        setEmailPrefillDismissed(false);
      };

      // Auto-open the SIGNUP modal from a deep-link: ?eventId=X&autoOpen=1
      // (used by the Learning Labs June homepage popup's "Sign Up Now" button).
      // Mirrors W2 events.html. Runs once after events load; ignores the
      // registration token+type flow handled by its own effect above.
      const autoOpenedRef = React.useRef(false);
      useEffect(() => {
        if (autoOpenedRef.current || loading) return;
        const params = new URLSearchParams(window.location.search);
        if (params.get('autoOpen') !== '1') return;
        const eid = params.get('eventId');
        if (!eid) return;
        if (params.get('token') && params.get('type')) return; // registration flow owns those links
        const ev = events.find(e => e.id === eid);
        if (!ev) return;
        autoOpenedRef.current = true;
        handleSignupClick(ev);
      }, [events, loading]);

      const handleFormChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const formatPhoneNumber = (value) => {
        // Remove all non-digits
        const digits = value.replace(/\D/g, '');
        
        // Limit to 10 digits
        const limited = digits.slice(0, 10);
        
        // Format as (XXX) XXX-XXXX
        if (limited.length <= 3) {
          return limited;
        } else if (limited.length <= 6) {
          return `(${limited.slice(0, 3)}) ${limited.slice(3)}`;
        } else {
          return `(${limited.slice(0, 3)}) ${limited.slice(3, 6)}-${limited.slice(6)}`;
        }
      };

      const handlePhoneChange = (value) => {
        const formatted = formatPhoneNumber(value);
        setFormData(prev => ({ ...prev, phone: formatted }));
      };

      const handleDateToggle = (date) => {
        setFormData(prev => ({
          ...prev,
          selectedDates: prev.selectedDates.includes(date)
            ? prev.selectedDates.filter(d => d !== date)
            : [...prev.selectedDates, date]
        }));
      };

      // ── Recurring signup handlers ──────────────────────────────────────────
      const handleRecurringSignupClick = async (prog) => {
        setRecurringSignupEvent(prog);
        setShowRecurringModal(true);
        setRecurringFormData({
          name: '', email: '', phone: '', preferredContact: '',
          registrantType: '',
          studentName: '', dob: '', studentId: '', grade: '',
          currentSchool: '', iepReviewDate: '', reevDate: '', careCoordinator: '',
          participationType: 'Individual', groupName: '', groupSize: '',
          selectedSessions: [], additionalComments: '',
          multipleSessionsReason: '',
          priorConnectGen: ''
        });

        // Fetch signups to determine which sessions are full
        try {
          const counts = {};
          const signupsSnap = await db.collection('recurringEvents').doc(prog.id).collection('signups').get();
          signupsSnap.docs.forEach(doc => {
            const s = doc.data();
            if (s.status === 'confirmed') {
              (s.selectedSessions || []).forEach(sessionKey => {

          console.error('Error fetching signups for capacity:', err);

      };

      const handleRecurringFormChange = (field, value) => {
        setRecurringFormData(prev => ({ ...prev, [field]: value }));
      };

      const handleSessionToggle = (label) => {
        setRecurringFormData(prev => ({
          ...prev,
          selectedSessions: prev.selectedSessions.includes(label)
            ? prev.selectedSessions.filter(s => s !== label)
            : [...prev.selectedSessions, label]
        }));
      };

      const handleRecurringSubmit = async (e) => {
        e.preventDefault();

        // Double-submit guard (2026-07-07): lock synchronously before any await
        // (a rapid second tap during the async write was creating duplicate
        // signups); the finally below always releases it, with a 20s
        // safety-net timer.
        if (window.__ldahLock_appRecurring) return;
        window.__ldahLock_appRecurring = true;
        var __unlockTimer;
        var __unlock = function () { clearTimeout(__unlockTimer); window.__ldahLock_appRecurring = false; };
        __unlockTimer = setTimeout(__unlock, 20000);
        try {

        // Validate phone is 10 digits
        const phoneDigits = recurringFormData.phone.replace(/\D/g, '');
        if (phoneDigits.length !== 10) {
          alert('Please enter a valid 10-digit phone number.');
          return;
        }

        // Multi-session guard — same content each week, so anything beyond one
        // session needs a written reason (e.g. signing up multiple kids).
        if (recurringFormData.selectedSessions.length === 0) {
          alert('Please pick the session you will attend.');
          return;
        }
        if (recurringFormData.selectedSessions.length > 1 &&
            recurringFormData.multipleSessionsReason.trim().length < 10) {
          alert('Each session covers the same content. Please tell us briefly why you need more than one (for example, signing up multiple children).');
          return;
        }

        // Connect-Gen only: returning-family front-end signal.
        const isConnectGenSubmit = recurringSignupEvent && recurringSignupEvent.zoomMode === 'program';
        if (isConnectGenSubmit && !recurringFormData.priorConnectGen) {
          alert('Please tell us whether you have ever participated in a Connect-Gen session before.');
          return;
        }

        setRecurringSubmitting(true);
        try {
          // Strip the DOB part fields (dobMonth/dobDay/dobYear) — they're UI
          // state only; the canonical value is `dob` (YYYY-MM-DD).
          const { dobMonth, dobDay, dobYear, ...recurringClean } = recurringFormData;
          // Second parent / guardian (optional).
          const _sp = collectSecondParent();
          window._secondParentDraft = _sp;
          const docRef = await db.collection('recurringEvents').doc(recurringSignupEvent.id)
            .collection('signups').add({
              ...recurringClean,
              ...(_sp ? { secondParent: _sp } : {}),
              // Mirror the signup role into `role` so the registration step
              // reads it and skips re-asking "About You" (v47.11).
              role: recurringFormData.registrantType || '',
              status: 'pending',
              // Attribute the signup origin from the ?src= URL param (defaults to 'direct')
              signupSource: _resolveSignupSource(),
              timestamp: firebase.firestore.FieldValue.serverTimestamp(),
              programTitle: recurringSignupEvent.title
            });

          // Update denormalized counts on parent doc
          await db.collection('recurringEvents').doc(recurringSignupEvent.id).update({
            signupCount: firebase.firestore.FieldValue.increment(1),
            pendingCount: firebase.firestore.FieldValue.increment(1)
          });

          setRecurringLastSignupDocId(docRef.id);
          setLastSignupEventId(recurringSignupEvent.id);
          setLastSignupType('recurring');
          setRecurringSubmitSuccess(true);
          setSecondParent({ firstName: '', lastName: '', email: '' });
          setShowSecondParent(false);
        } catch (error) {
          console.error('Error submitting recurring signup:', error);
          alert('There was an error submitting your signup. Please try again.');
        } finally {
          setRecurringSubmitting(false);
        }
        } finally { __unlock(); }
      };

      const handleSubmitSignup = async (e) => {
        e.preventDefault();

        // Double-submit guard (2026-07-07): the duplicate-check network call runs
        // before the form locks, so a second tap during that window was creating
        // duplicate signups. Lock synchronously now (before any await); the
        // finally below always releases it, with a 20s safety-net timer.
        if (window.__ldahLock_appSignup) return;
        window.__ldahLock_appSignup = true;
        var __unlockTimer;
        var __unlock = function () { clearTimeout(__unlockTimer); window.__ldahLock_appSignup = false; };
        __unlockTimer = setTimeout(__unlock, 20000);
        try {

        // Validate phone is 10 digits
        const phoneDigits = formData.phone.replace(/\D/g, '');

        }

        // Headcount. Capacity, session sheets and the audit export all count
        // PEOPLE, not signups, so a group must state a number and an individual
        // is written as exactly 1. participationType is what the counting keys

        // When showGroupField is false the question is never asked, so there is

        let _hcType = 'Individual', _hcSize = 1;
        const _hcAsked = signupEvent.showGroupField !== false;
        if (_hcAsked && (formData.participationType || 'Group') === 'Group') {
          const _gs = parseInt(String(formData.groupSize || '').trim(), 10);
          if (!isFinite(_gs) || _gs < 1) {
            alert('Please enter how many people are attending.');
            return;
          }
          _hcType = 'Group'; _hcSize = _gs;
        }

        try {

            });

            role: formData.registrantType || '',

            signupSource: _resolveSignupSource(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            eventTitle: signupEvent.title
          };

          // Second parent / guardian (optional): top-level for immediate email

          const _sp = collectSecondParent();
          window._secondParentDraft = _sp;
          if (_sp) signupDoc.secondParent = _sp;

          if (isInlineReg) {

              role: formData.registrantType || '',

              accommodations: formData.accommodations || ''

            if (_sp) signupDoc.registration.secondParent = _sp;
            signupDoc.registrantType = formData.registrantType || '';
            signupDoc.registrationCompletedAt = firebase.firestore.FieldValue.serverTimestamp();
            signupDoc.registrationFlow = 'inline-at-signup';

          // Update denormalized counts on parent doc

          if (isInlineReg) {

                          tileClass: 'ev-ong',

                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    );
                  });
                  return <div style={{ padding: '4px 4px 32px' }}>{out}</div>;
