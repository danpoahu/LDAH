                          <label style={{ display: 'block', color: '#004E7C', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>Reason for Attending <span style={{ color: '#DC2626' }}>*</span></label>
                          <select required value={formData.reasonForAttending}
                            onChange={(e) => handleFormChange('reasonForAttending', e.target.value)}
                            disabled={submitting}
                            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: submitting ? 0.6 : 1 }}>
                            <option value="">-- Select --</option>
                            {['Parent/Guardian', 'Surrogate Parent', 'Grandparent', 'Student', 'Professional', 'Other'].map(r => (
                              <option key={r} value={r}>{r}</option>
                            ))}
                          </select>
                        </div>

                        {/* Prior Training */}
                        <div style={{ marginBottom: '14px' }}>
                          <label style={{ display: 'block', color: '#004E7C', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>Prior LDAH training in the past 12 months?</label>
                          <div style={{ display: 'flex', gap: '16px' }}>
                            {['No', 'Yes'].map(val => (
                              <label key={val} style={{ display: 'flex', alignItems: 'center', gap: '6px', cursor: submitting ? 'not-allowed' : 'pointer' }}>
                                <input type="radio" name="inlinePriorTraining" value={val}
                                  checked={formData.priorTraining === val}
                                  onChange={(e) => handleFormChange('priorTraining', e.target.value)}
                                  disabled={submitting}
                                  style={{ width: '16px', height: '16px', cursor: submitting ? 'not-allowed' : 'pointer' }} />
                                <span style={{ fontSize: '14px', color: '#374151' }}>{val}</span>
                              </label>
                            ))}
                          </div>
                          {formData.priorTraining === 'Yes' && (
                            <div style={{ marginTop: '10px', paddingLeft: '24px' }}>
                              <label style={{ display: 'block', color: '#004E7C', fontWeight: '600', marginBottom: '6px', fontSize: '13px' }}>Date of last training</label>
                              <input type="date" value={formData.priorTrainingDate}
                                onChange={(e) => handleFormChange('priorTrainingDate', e.target.value)}
                                disabled={submitting}
                                style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: submitting ? 0.6 : 1 }} />
                            </div>
                          )}
                        </div>

                        {/* How Heard */}
                        <div style={{ marginBottom: '14px' }}>
                          <label style={{ display: 'block', color: '#004E7C', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>How did you hear about this training? <span style={{ color: '#DC2626' }}>*</span></label>
                          <select required value={formData.howHeard}
                            onChange={(e) => {
                              const v = e.target.value;
                              handleFormChange('howHeard', v);
                              if (v !== 'Other') handleFormChange('howHeardOther', '');
                            }}
                            disabled={submitting}
                            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: submitting ? 0.6 : 1 }}>
                            <option value="">-- Select --</option>
                            {['Agency', 'Newspaper', 'School', 'Radio', 'Website', 'Facebook', 'Other'].map(h => (
                              <option key={h} value={h}>{h}</option>
                            ))}
                          </select>
                          {formData.howHeard === 'Other' && (
                            <div style={{ marginTop: '10px' }}>
                              <label style={{ display: 'block', color: '#004E7C', fontWeight: '600', marginBottom: '6px', fontSize: '13px' }}>Please specify <span style={{ color: '#DC2626' }}>*</span></label>
                              <input type="text" required value={formData.howHeardOther} maxLength="200"
                                onChange={(e) => handleFormChange('howHeardOther', e.target.value)}
                                disabled={submitting} placeholder="Tell us how you heard about us"
                                style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: submitting ? 0.6 : 1 }} />
                            </div>
                          )}
                        </div>

                        {/* Accommodations */}
                        <div style={{ marginBottom: '0' }}>
                          <label style={{ display: 'block', color: '#004E7C', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>Accommodations Needed</label>
                          <textarea value={formData.accommodations}
                            onChange={(e) => handleFormChange('accommodations', e.target.value)}
                            disabled={submitting} rows="3"
                            placeholder="Please let us know at least 2 weeks prior to the event..."
                            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', fontFamily: 'inherit', resize: 'vertical', opacity: submitting ? 0.6 : 1 }} />
                        </div>
                      </div>
                    )}

                    {/* Phone */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Phone Number (best to text or call) *
                      </label>
                      <input
                        type="tel"
                        required
                        value={formData.phone}
                        onChange={(e) => handlePhoneChange(e.target.value)}
                        onBlur={(e) => handleFormChange('phone', window.LDAHFormat ? window.LDAHFormat.formatPhone(e.target.value) : e.target.value)}
                        disabled={submitting}
                        placeholder="(808) 555-1234"
                        style={{
                          width: '100%',
                          padding: '12px',
                          border: '1px solid #D1D5DB',
                          borderRadius: '8px',
                          fontSize: '14px',
                          opacity: submitting ? 0.6 : 1
                        }}
                      />
                    </div>

                    {/* Second parent / guardian (optional) */}
                    <div style={{ marginBottom: '20px' }}>
                      {!showSecondParent ? (
                        <a href="#" onClick={(e) => { e.preventDefault(); setShowSecondParent(true); }} style={{ fontSize: '.9rem', color: '#0891B2', textDecoration: 'none', fontWeight: 600 }}>+ Add a second parent/guardian (optional)</a>
                      ) : (
                        <div>
                          <div style={{ fontWeight: 600, marginBottom: '6px', color: '#004E7C' }}>Second parent / guardian</div>
                          <input type="text" placeholder="First name" value={secondParent.firstName} onChange={(e) => setSecondParent(prev => ({ ...prev, firstName: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', marginBottom: '8px' }} />
                          <input type="text" placeholder="Last name" value={secondParent.lastName} onChange={(e) => setSecondParent(prev => ({ ...prev, lastName: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', marginBottom: '8px' }} />
                          <input type="email" placeholder="Email" value={secondParent.email} onChange={(e) => setSecondParent(prev => ({ ...prev, email: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px' }} />
                        </div>
                      )}
                    </div>

                    {/* Preferred Contact Method */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Preferred Method of Contact *
                      </label>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {['Email', 'Phone call', 'Text'].map(method => (
                          <label key={method} style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: submitting ? 'not-allowed' : 'pointer' }}>
                            <input
                              type="radio"
                              name="preferredContact"
                              value={method}
                              checked={formData.preferredContact === method}
                              onChange={(e) => handleFormChange('preferredContact', e.target.value)}
                              disabled={submitting}
                              required
                              style={{ width: '18px', height: '18px', cursor: submitting ? 'not-allowed' : 'pointer' }}
                            />
                            <span style={{ fontSize: '14px', color: '#374151' }}>{method}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    {/* Select Dates — when only 1 non-expired date exists we auto-select
                        it in handleSignupClick and just display the date as a read-only
                        line so the user still sees what they signed up for. */}
                    {(() => {
                      const allDates = (signupEvent.signupDates) || [];
                      const nonExpired = allDates.filter(d => !isSignupDateExpired(d));
                      if (nonExpired.length === 1) {
                        return (
                          <div style={{ marginBottom: '20px' }}>
                            <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Event Date</label>
                            <div style={{ padding: '10px 12px', background: '#f0f9ff', borderRadius: '8px', border: '1px solid #e0f2fe', color: '#0369a1', fontWeight: '600', fontSize: '14px' }}>
                              {nonExpired[0]}
                            </div>
                          </div>
                        );
                      }
                      if (nonExpired.length === 0) return null;
                      return (
                        <div style={{ marginBottom: '20px' }}>
                          <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                            Select the dates you're available to attend *
                          </label>
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            {allDates.map((date, index) => {
                              const expired = isSignupDateExpired(date);
                              return (
                                <label key={index} style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: (submitting || expired) ? 'not-allowed' : 'pointer', opacity: expired ? 0.6 : 1 }}>
                                  <input
                                    type="checkbox"
                                    checked={formData.selectedDates.includes(date)}
                                    onChange={() => handleDateToggle(date)}
                                    disabled={submitting || expired}
                                    style={{ width: '18px', height: '18px', cursor: (submitting || expired) ? 'not-allowed' : 'pointer' }}
                                  />
                                  <span style={{ fontSize: '14px', color: '#374151', textDecoration: expired ? 'line-through' : 'none' }}>{date}</span>
                                </label>
                              );
                            })}
                          </div>
                          {formData.selectedDates.length === 0 && (
                            <p style={{ color: '#DC2626', fontSize: '12px', marginTop: '4px' }}>
                              Please select at least one date
                            </p>
                          )}
                        </div>
                      );
                    })()}

                    {/* Custom Questions */}
                    {signupEvent.customQuestions && signupEvent.customQuestions.length > 0 && (
                      <>
                        {signupEvent.customQuestions.map((question, index) => (
                          <div key={index} style={{ marginBottom: '20px' }}>
                            <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px', lineHeight: '1.6' }}>
                              {convertUrlsToLinks(question)}
                            </label>
                            <textarea
                              value={formData.customAnswers[question] || ''}
                              onChange={(e) => setFormData(prev => ({
                                ...prev,
                                customAnswers: {
                                  ...prev.customAnswers,
                                  [question]: e.target.value
                                }
                              }))}
                              disabled={submitting}
                              placeholder="Your answer"
                              rows="3"
                              style={{
                                width: '100%',
                                padding: '12px',
                                border: '1px solid #D1D5DB',
                                borderRadius: '8px',
                                fontSize: '14px',
                                resize: 'vertical',
                                fontFamily: 'inherit',
                                opacity: submitting ? 0.6 : 1
                              }}
                            />
                          </div>
                        ))}
                      </>
                    )}

                    {/* Special Accommodations */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Any additional comments or special accommodations we should know about?
                      </label>
                      <textarea
                        value={formData.additionalComments}
                        onChange={(e) => handleFormChange('additionalComments', e.target.value)}
                        disabled={submitting}
                        placeholder="Your answer"
                        rows="4"
                        style={{
                          width: '100%',
                          padding: '12px',
                          border: '1px solid #D1D5DB',
                          borderRadius: '8px',
                          fontSize: '14px',
                          resize: 'vertical',
                          fontFamily: 'inherit',
                          opacity: submitting ? 0.6 : 1
                        }}
                      />
                    </div>

                    {/* Participation Type — hidden when showGroupField is explicitly false */}
                    {signupEvent.showGroupField !== false && (
                      <div style={{ marginBottom: '20px' }}>
                        <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                          Are you attending on your own, or with others? *
                        </label>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          {[['Individual', 'Just me'], ['Group', 'Me and others']].map(([type, optLabel]) => (
                            <label key={type} style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: submitting ? 'not-allowed' : 'pointer' }}>
                              <input
                                type="radio"
                                name="participationType"
                                value={type}
                                checked={(formData.participationType || 'Group') === type}
                                onChange={(e) => handleFormChange('participationType', e.target.value)}
                                disabled={submitting}
                                required
                                style={{ width: '18px', height: '18px', cursor: submitting ? 'not-allowed' : 'pointer' }}
                              />
                              <span style={{ fontSize: '14px', color: '#374151' }}>{optLabel}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Participant count (conditional) — mirrors the website: the
                        count only, no group name. Default to Group so this shows
                        before the radios have been touched, same as W2. */}
                    {signupEvent.showGroupField !== false && (formData.participationType || 'Group') === 'Group' && (
                      <div style={{ marginBottom: '20px', paddingLeft: '26px' }}>
                        <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                          How many participants? *
                        </label>
                        <input
                          type="number"
                          required
                          min="1"
                          step="1"
                          value={formData.groupSize}
                          onChange={(e) => handleFormChange('groupSize', e.target.value)}
                          disabled={submitting}
                          placeholder="# of participants"
                          style={{
                            width: '100%',
                            padding: '12px',
                            border: '1px solid #D1D5DB',
                            borderRadius: '8px',
                            fontSize: '14px',
                            opacity: submitting ? 0.6 : 1
                          }}
                        />
                      </div>
                    )}

                    {/* Submit Buttons */}
                    <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end' }}>
                      <button
                        type="button"
                        onClick={() => setShowSignupModal(false)}
                        disabled={submitting}
                        style={{
                          padding: '12px 24px',
                          backgroundColor: 'white',
                          color: '#004E7C',
                          border: '2px solid #004E7C',
                          borderRadius: '8px',
                          fontSize: '14px',
                          fontWeight: 'bold',
                          cursor: submitting ? 'not-allowed' : 'pointer',
                          opacity: submitting ? 0.5 : 1,
                          transition: 'all 0.2s'
                        }}
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        disabled={submitting || formData.selectedDates.length === 0}
                        style={{
                          padding: '12px 24px',
                          backgroundColor: (submitting || formData.selectedDates.length === 0) ? '#9CA3AF' : '#004E7C',
                          color: 'white',
                          border: 'none',
                          borderRadius: '8px',
                          fontSize: '14px',
                          fontWeight: 'bold',
                          cursor: (submitting || formData.selectedDates.length === 0) ? 'not-allowed' : 'pointer',
                          transition: 'all 0.2s'
                        }}
                      >
                        {submitting ? 'Submitting...' : 'Submit'}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* ── Recurring Program Signup Modal ──────────────────────────────── */}
          {showRecurringModal && recurringSignupEvent && (
            <div
              onClick={() => !recurringSubmitting && setShowRecurringModal(false)}
              style={{
                position: 'fixed', top: 0, left: 0, width: '100%', height: '100%',
                backgroundColor: 'rgba(0, 0, 0, 0.8)', zIndex: 2000,
                display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
                padding: '20px', overflowY: 'auto'
              }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                style={{
                  backgroundColor: 'white', borderRadius: '24px', padding: '32px',
                  maxWidth: '600px', width: '100%',
                  position: 'relative', border: '3px solid #0D7A7A',
                  marginTop: '20px', marginBottom: '20px'
                }}
              >
                {/* Close button */}
                <button
                  onClick={() => !recurringSubmitting && setShowRecurringModal(false)}
                  disabled={recurringSubmitting}
                  style={{
                    position: 'absolute', top: '16px', right: '16px',
                    backgroundColor: 'transparent', border: 'none', color: '#0D7A7A',
                    cursor: recurringSubmitting ? 'not-allowed' : 'pointer',
                    opacity: recurringSubmitting ? 0.5 : 1, padding: '8px'
                  }}
                >
                  <X size={24} />
                </button>

                {recurringSubmitSuccess ? (
                  <div style={{ textAlign: 'center', padding: '40px 20px' }}>
                    <div style={{ width: '56px', height: '56px', borderRadius: '50%', background: '#22c55e', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px' }}>
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <h2 style={{ color: '#0D7A7A', fontSize: '24px', fontWeight: 'bold', marginBottom: '12px' }}>
                      Mahalo! You're signed up.
                    </h2>
                    <p style={{ color: '#666', fontSize: '16px', marginBottom: '24px' }}>
                      Complete your registration to confirm your spot.
                    </p>
                    <button
                      onClick={() => {
                        setShowRecurringModal(false);
                        setRecurringSubmitSuccess(false);
                        openRegistration(recurringLastSignupDocId, lastSignupEventId, 'recurring', prefillStash || undefined);
                      }}
                      style={{
                        display: 'inline-block', padding: '14px 32px',
                        background: 'linear-gradient(135deg, #004E7C, #0066a1)',
                        color: 'white', border: 'none', borderRadius: '50px',
                        fontWeight: '600', fontSize: '16px', cursor: 'pointer',
                        transition: 'transform 0.15s, box-shadow 0.15s',
                        boxShadow: '0 2px 8px rgba(0, 78, 124, 0.3)',
                        marginBottom: '12px'
                      }}
                      onMouseOver={(e) => { e.currentTarget.style.transform='translateY(-1px)'; e.currentTarget.style.boxShadow='0 4px 12px rgba(0,78,124,0.4)'; }}
                      onMouseOut={(e) => { e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow='0 2px 8px rgba(0,78,124,0.3)'; }}
                    >
                      Complete Registration
                    </button>
                    <br />
                    <button
                      onClick={() => { setShowRecurringModal(false); setRecurringSubmitSuccess(false); }}
                      style={{
                        padding: '10px 24px', backgroundColor: 'transparent',
                        color: '#666', border: '1px solid #D1D5DB', borderRadius: '8px',
                        fontSize: '14px', cursor: 'pointer', marginTop: '8px'
                      }}
                    >
                      Done
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleRecurringSubmit}>
                    <h2 style={{ color: '#0D7A7A', fontSize: '22px', fontWeight: 'bold', marginBottom: '6px', paddingRight: '40px' }}>
                      Sign Up: {recurringSignupEvent.title}
                    </h2>
                    <p style={{ color: '#666', fontSize: '14px', marginBottom: '24px' }}>
                      * Indicates required question
                    </p>

                    {/* ── Contact Info ── */}
                    {/* Email — first field; consistent with one-time form (v48.1.0) */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Email Address *
                      </label>
                      <input
                        type="email" required
                        autoFocus
                        value={recurringFormData.email}
                        onChange={(e) => handleRecurringFormChange('email', e.target.value)}
                        disabled={recurringSubmitting}
                        placeholder="Your answer"
                        style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                      />
                    </div>

                    {/* Full Name */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Your Full Name (Parent/Guardian) *
                      </label>
                      <input
                        type="text" required
                        value={recurringFormData.name}
                        onChange={(e) => handleRecurringFormChange('name', e.target.value)}
                        onBlur={(e) => handleRecurringFormChange('name', window.LDAHFormat ? window.LDAHFormat.formatNameSmart(e.target.value) : e.target.value)}
                        disabled={recurringSubmitting}
                        placeholder="Your answer"
                        style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                      />
                    </div>

                    {/* Registrant Type */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        I am a... *
                      </label>
                      <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap' }}>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: recurringSubmitting ? 'not-allowed' : 'pointer' }}>
                          <input type="radio" name="registrantType" value="Parent/Guardian" required
                            checked={recurringFormData.registrantType === 'Parent/Guardian'}
                            onChange={(e) => handleRecurringFormChange('registrantType', e.target.value)}
                            disabled={recurringSubmitting}
                            style={{ width: '18px', height: '18px', accentColor: '#0D7A7A' }}
                          />
                          <span style={{ fontSize: '14px', color: '#374151' }}>Parent / Guardian</span>
                        </label>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: recurringSubmitting ? 'not-allowed' : 'pointer' }}>
                          <input type="radio" name="registrantType" value="Professional" required
                            checked={recurringFormData.registrantType === 'Professional'}
                            onChange={(e) => handleRecurringFormChange('registrantType', e.target.value)}
                            disabled={recurringSubmitting}
                            style={{ width: '18px', height: '18px', accentColor: '#0D7A7A' }}
                          />
                          <span style={{ fontSize: '14px', color: '#374151' }}>Professional</span>
                        </label>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: recurringSubmitting ? 'not-allowed' : 'pointer' }}>
                          <input type="radio" name="registrantType" value="Student" required
                            checked={recurringFormData.registrantType === 'Student'}
                            onChange={(e) => handleRecurringFormChange('registrantType', e.target.value)}
                            disabled={recurringSubmitting}
                            style={{ width: '18px', height: '18px', accentColor: '#0D7A7A' }}
                          />
                          <span style={{ fontSize: '14px', color: '#374151' }}>Student</span>
                        </label>
                        <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: recurringSubmitting ? 'not-allowed' : 'pointer' }}>
                          <input type="radio" name="registrantType" value="Community Member" required
                            checked={recurringFormData.registrantType === 'Community Member'}
                            onChange={(e) => handleRecurringFormChange('registrantType', e.target.value)}
                            disabled={recurringSubmitting}
                            style={{ width: '18px', height: '18px', accentColor: '#0D7A7A' }}
                          />
                          <span style={{ fontSize: '14px', color: '#374151' }}>Community Member</span>
                        </label>

                    </div>

                    {/* Phone */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Phone Number *
                      </label>
                      <input
                        type="tel" required
                        value={recurringFormData.phone}
                        onChange={(e) => {
                          const digits = e.target.value.replace(/\D/g,'').slice(0,10);
                          const fmt = digits.length<=3 ? digits
                            : digits.length<=6 ? `(${digits.slice(0,3)}) ${digits.slice(3)}`
                            : `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
                          handleRecurringFormChange('phone', fmt);
                        }}
                        onBlur={(e) => handleRecurringFormChange('phone', window.LDAHFormat ? window.LDAHFormat.formatPhone(e.target.value) : e.target.value)}
                        disabled={recurringSubmitting}
                        placeholder="(808) 555-1234"
                        style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                      />
                    </div>

                    {/* Second parent / guardian (optional) */}
                    <div style={{ marginBottom: '20px' }}>
                      {!showSecondParent ? (
                        <a href="#" onClick={(e) => { e.preventDefault(); setShowSecondParent(true); }} style={{ fontSize: '.9rem', color: '#0891B2', textDecoration: 'none', fontWeight: 600 }}>+ Add a second parent/guardian (optional)</a>
                      ) : (
                        <div>
                          <div style={{ fontWeight: 600, marginBottom: '6px', color: '#004E7C' }}>Second parent / guardian</div>
                          <input type="text" placeholder="First name" value={secondParent.firstName} onChange={(e) => setSecondParent(prev => ({ ...prev, firstName: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', marginBottom: '8px' }} />
                          <input type="text" placeholder="Last name" value={secondParent.lastName} onChange={(e) => setSecondParent(prev => ({ ...prev, lastName: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', marginBottom: '8px' }} />
                          <input type="email" placeholder="Email" value={secondParent.email} onChange={(e) => setSecondParent(prev => ({ ...prev, email: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px' }} />
                        </div>
                      )}
                    </div>

                    {/* Preferred Contact */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Preferred Method of Contact *
                      </label>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {['Email', 'Phone call', 'Text'].map(method => (
                          <label key={method} style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: recurringSubmitting ? 'not-allowed' : 'pointer' }}>
                            <input
                              type="radio" name="recurringPreferredContact" value={method} required
                              checked={recurringFormData.preferredContact === method}
                              onChange={(e) => handleRecurringFormChange('preferredContact', e.target.value)}
                              disabled={recurringSubmitting}
                              style={{ width: '18px', height: '18px' }}
                            />
                            <span style={{ fontSize: '14px', color: '#374151' }}>{method}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    {/* ── Student Information Box ── */}
                    <div style={{
                      backgroundColor: '#f0fafa', border: '2px solid #0D7A7A',
                      borderRadius: '12px', padding: '16px', marginBottom: '20px'
                    }}>
                      <h3 style={{ color: '#0D7A7A', fontWeight: 'bold', marginBottom: '16px', fontSize: '15px', margin: '0 0 16px 0' }}>
                        Student Information
                      </h3>

                      {/* Student Name */}
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0D7A7A', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          Student's Name *
                        </label>
                        <input type="text" required
                          value={recurringFormData.studentName}
                          onChange={(e) => handleRecurringFormChange('studentName', e.target.value)}
                          onBlur={(e) => handleRecurringFormChange('studentName', window.LDAHFormat ? window.LDAHFormat.formatNameSmart(e.target.value) : e.target.value)}
                          disabled={recurringSubmitting} placeholder="First and last name"
                          style={{ width: '100%', padding: '10px', border: '1px solid #0D7A7A', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                        />
                      </div>

                      {/* Date of Birth — three selects (mobile-friendly; iOS scroll wheel
                          is painful 10+ years back). Combined into YYYY-MM-DD on every change
                          so recurringFormData.dob stays the canonical value. */}
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0D7A7A', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          Date of Birth *
                        </label>
                        {(() => {
                          // Each dropdown is bound to its OWN state field so a
                          // partial selection persists; dob (YYYY-MM-DD) is
                          // recomputed when all three are set + valid. Falls
                          // back to splitting a prefilled dob on first render.
                          const dobStr = recurringFormData.dob || '';
                          const mV = recurringFormData.dobMonth || dobStr.split('-')[1] || '';
                          const dV = recurringFormData.dobDay   || dobStr.split('-')[2] || '';
                          const yV = recurringFormData.dobYear  || dobStr.split('-')[0] || '';
                          const setPart = (field, val) => {
                            setRecurringFormData(prev => {
                              const next = { ...prev, [field]: val };
                              const m = next.dobMonth, d = next.dobDay, y = next.dobYear;
                              let iso = '';
                              if (m && d && y) {
                                const cand = y + '-' + m + '-' + d;
                                const dt = new Date(cand + 'T12:00:00Z');
                                if (!isNaN(dt.getTime()) &&
                                    dt.getUTCFullYear() === parseInt(y, 10) &&
                                    dt.getUTCMonth() === parseInt(m, 10) - 1 &&
                                    dt.getUTCDate() === parseInt(d, 10)) {
                                  iso = cand;
                                }
                              }
                              next.dob = iso;
                              return next;
                            });
                          };
                          const months = [
                            ['01','January'],['02','February'],['03','March'],['04','April'],
                            ['05','May'],['06','June'],['07','July'],['08','August'],
                            ['09','September'],['10','October'],['11','November'],['12','December']
                          ];
                          const cy = new Date().getFullYear();
                          const years = [];
                          for (let y = cy; y >= cy - 100; y--) years.push(y);
                          const days = [];
                          for (let d = 1; d <= 31; d++) days.push(d < 10 ? '0' + d : String(d));
                          const selStyle = { padding: '10px 8px', border: '1px solid #0D7A7A', borderRadius: '8px', fontSize: '14px', background: '#fff', minWidth: 0, boxSizing: 'border-box', opacity: recurringSubmitting ? 0.6 : 1 };
                          return (
                            <div style={{ display: 'flex', gap: '6px' }}>
                              <select required value={mV} disabled={recurringSubmitting}
                                onChange={(e) => setPart('dobMonth', e.target.value)}
                                style={{ ...selStyle, flex: 1.6 }}>
                                <option value="">Month</option>
                                {months.map(m => <option key={m[0]} value={m[0]}>{m[1]}</option>)}
                              </select>
                              <select required value={dV} disabled={recurringSubmitting}
                                onChange={(e) => setPart('dobDay', e.target.value)}
                                style={{ ...selStyle, flex: 1 }}>
                                <option value="">Day</option>
                                {days.map(d => <option key={d} value={d}>{parseInt(d, 10)}</option>)}
                              </select>
                              <select required value={yV} disabled={recurringSubmitting}
                                onChange={(e) => setPart('dobYear', e.target.value)}
                                style={{ ...selStyle, flex: 1.2 }}>
                                <option value="">Year</option>
                                {years.map(y => <option key={y} value={y}>{y}</option>)}
                              </select>
                            </div>
                          );
                        })()}
                      </div>

                      {/* Student ID */}
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0D7A7A', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          Student ID# *
                        </label>
                        <input type="text" required
                          value={recurringFormData.studentId}
                          onChange={(e) => handleRecurringFormChange('studentId', e.target.value)}
                          disabled={recurringSubmitting} placeholder="Student ID number"
                          style={{ width: '100%', padding: '10px', border: '1px solid #0D7A7A', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                        />
                      </div>

                      {/* Grade */}
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0D7A7A', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          Grade *
                        </label>
                        <input type="text" required
                          value={recurringFormData.grade}
                          onChange={(e) => handleRecurringFormChange('grade', e.target.value)}
                          disabled={recurringSubmitting} placeholder="e.g. 3rd, 8th, 12th"
                          style={{ width: '100%', padding: '10px', border: '1px solid #0D7A7A', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                        />
                      </div>

                      {/* Current School */}
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0D7A7A', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          Current School *
                        </label>
                        <input type="text" required
                          value={recurringFormData.currentSchool}
                          onChange={(e) => handleRecurringFormChange('currentSchool', e.target.value)}
                          disabled={recurringSubmitting} placeholder="School name"
                          style={{ width: '100%', padding: '10px', border: '1px solid #0D7A7A', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                        />
                      </div>

                      {/* IEP Annual Review Date */}
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0D7A7A', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          IEP Annual Review Date *
                        </label>
                        <input type="date" required
                          value={recurringFormData.iepReviewDate}
                          onChange={(e) => handleRecurringFormChange('iepReviewDate', e.target.value)}
                          disabled={recurringSubmitting}
                          style={{ width: '100%', padding: '10px', border: '1px solid #0D7A7A', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                        />
                      </div>

                      {/* Reevaluation Date */}
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0D7A7A', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          Reevaluation Date *
                        </label>
                        <input type="date" required
                          value={recurringFormData.reevDate}
                          onChange={(e) => handleRecurringFormChange('reevDate', e.target.value)}
                          disabled={recurringSubmitting}
                          style={{ width: '100%', padding: '10px', border: '1px solid #0D7A7A', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                        />
                      </div>

                      {/* Care Coordinator */}
                      <div>
                        <label style={{ display: 'block', color: '#0D7A7A', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          Care Coordinator *
                        </label>
                        <input type="text" required
                          value={recurringFormData.careCoordinator}
                          onChange={(e) => handleRecurringFormChange('careCoordinator', e.target.value)}
                          onBlur={(e) => handleRecurringFormChange('careCoordinator', window.LDAHFormat ? window.LDAHFormat.formatNameSmart(e.target.value) : e.target.value)}
                          disabled={recurringSubmitting} placeholder="Care coordinator name"
                          style={{ width: '100%', padding: '10px', border: '1px solid #0D7A7A', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                        />
                      </div>
                    </div>

                    {/* ── Session Selection ── */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Select ONE session you will be attending *
                      </label>
                      {(() => {
                        const blockedMondays = (recurringFormData.email || '').trim().toLowerCase() === 'containerscapes@gmail.com';
                        // Connect-Gen (zoomMode === 'program') forces single-date selection via radio inputs
                        const isConnectGen = recurringSignupEvent.zoomMode === 'program';
                        // _occurrences items are raw {date, schedule} — read date.getDay() directly (1 = Monday)
                        const visibleOccurrences = (recurringSignupEvent._occurrences || []).filter(occ => {
                          if (!blockedMondays) return true;
                          return !occ.date || occ.date.getDay() !== 1;
                        });
                        return visibleOccurrences.map((occ, i) => {
                        const { key, display } = formatOccurrence(occ);
                        const isFull = (sessionConfirmedCounts[key] || 0) >= RECURRING_SESSION_CAPACITY;
                        return (
                          <label key={i} style={{
                            display: 'flex', alignItems: 'flex-start', gap: '8px',
                            padding: '10px 12px', marginBottom: '8px', borderRadius: '8px',
                            background: isFull ? '#fee2e2' : '#f0f9ff',
                            border: `1px solid ${isFull ? '#fecaca' : '#e0f2fe'}`,
                            cursor: isFull || recurringSubmitting ? 'not-allowed' : 'pointer',
                            opacity: isFull ? 0.6 : 1
                          }}>
                            <input
                              type={isConnectGen ? 'radio' : 'checkbox'}
                              name={isConnectGen ? 'recurringSessionSelection' : undefined}
                              checked={recurringFormData.selectedSessions.includes(key)}
                              onChange={() => {
                                if (isConnectGen) {
                                  // Single-select: replace any prior selection
                                  setRecurringFormData(prev => ({ ...prev, selectedSessions: [key] }));
                                } else {
                                  handleSessionToggle(key);
                                }
                              }}
                              disabled={recurringSubmitting || isFull}
                              style={{ width: '18px', height: '18px', marginTop: '2px', flexShrink: 0, cursor: isFull ? 'not-allowed' : 'pointer' }}
                            />
                            <span style={{ fontSize: '14px', color: isFull ? '#991b1b' : '#374151', lineHeight: '1.5' }}>
                              {display}
                              {isFull && (
                                <span style={{ background: '#DC2626', color: 'white', padding: '1px 8px', borderRadius: '50px', fontSize: '11px', fontWeight: 700, marginLeft: '6px' }}>FULL</span>
                              )}
                            </span>
                          </label>
                        );
                        });
                      })()}
                      {recurringSignupEvent.zoomMode !== 'program' && recurringFormData.selectedSessions.length > 1 && (
                        <div style={{
                          marginTop: '14px',
                          padding: '14px 16px',
                          background: '#FEF3C7',
                          border: '1px solid #FBBF24',
                          borderRadius: '12px'
                        }}>
                          <p style={{ margin: '0 0 8px', fontSize: '13px', color: '#78350F', fontWeight: '700', lineHeight: '1.4' }}>
                            Heads up — these sessions all cover the same content.
                          </p>
                          <p style={{ margin: '0 0 10px', fontSize: '12.5px', color: '#92400E', lineHeight: '1.45' }}>
                            You've picked <strong>{recurringFormData.selectedSessions.length}</strong> sessions. If you're signing up for more than one (for example, multiple children), please tell us why so we can plan accordingly.
                          </p>
                          <textarea
                            required
                            value={recurringFormData.multipleSessionsReason}
                            onChange={(e) => setRecurringFormData(prev => ({ ...prev, multipleSessionsReason: e.target.value }))}
                            placeholder="e.g., Signing up two children for different days"
                            rows={3}
                            style={{
                              width: '100%',
                              padding: '8px 10px',
                              border: '1px solid #D1D5DB',
                              borderRadius: '8px',
                              fontSize: '13px',
                              fontFamily: 'inherit',
                              resize: 'vertical',
                              boxSizing: 'border-box'
                            }}
                          />
                        </div>
                      )}
                    </div>

                    {/* ── Participation Type (showGroupField guard) ── */}
                    {recurringSignupEvent.showGroupField !== false && (
                      <>
                        <div style={{ marginBottom: '20px' }}>
                          <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                            Are you attending on your own, or with others? *
                          </label>
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            {[['Individual', 'Just me'], ['Group', 'Me and others']].map(([type, optLabel]) => (
                              <label key={type} style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: recurringSubmitting ? 'not-allowed' : 'pointer' }}>
                                <input
                                  type="radio" name="recurringParticipationType" value={type} required
                                  checked={(recurringFormData.participationType || 'Group') === type}
                                  onChange={(e) => handleRecurringFormChange('participationType', e.target.value)}
                                  disabled={recurringSubmitting}
                                  style={{ width: '18px', height: '18px' }}
                                />
                                <span style={{ fontSize: '14px', color: '#374151' }}>{optLabel}</span>
                              </label>
                            ))}
                          </div>
                        </div>
                        {recurringFormData.participationType === 'Group' && (
                          <div style={{ marginBottom: '20px', paddingLeft: '26px' }}>
                            <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                              Group name and number of members? *
                            </label>
                            <div style={{ display: 'flex', gap: '12px' }}>
                              <input type="text" required
                                value={recurringFormData.groupName}
                                onChange={(e) => handleRecurringFormChange('groupName', e.target.value)}
                                disabled={recurringSubmitting} placeholder="Group name"
                                style={{ flex: 2, padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                              />
                              <input type="number" required min="1"
                                value={recurringFormData.groupSize}
                                onChange={(e) => handleRecurringFormChange('groupSize', e.target.value)}
                                disabled={recurringSubmitting} placeholder="# members"
                                style={{ flex: 1, padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                              />
                            </div>
                          </div>
                        )}
                      </>
                    )}

                    {/* ── Returning Connect-Gen Family (CG only) ── */}
                    {recurringSignupEvent.zoomMode === 'program' && (
                      <div style={{ marginBottom: '20px' }}>
                        <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                          Have you ever participated in a Connect-Gen session before? *
                        </label>
                        <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap' }}>
                          {['Yes', 'No'].map(opt => (
                            <label key={opt} style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: recurringSubmitting ? 'not-allowed' : 'pointer' }}>
                              <input
                                type="radio" name="recurringPriorCG" value={opt} required
                                checked={recurringFormData.priorConnectGen === opt}
                                onChange={(e) => handleRecurringFormChange('priorConnectGen', e.target.value)}
                                disabled={recurringSubmitting}
                                style={{ width: '18px', height: '18px', accentColor: '#0369a1' }}
                              />
                              <span style={{ fontSize: '14px', color: '#374151' }}>{opt}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* ── Additional Comments ── */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Any additional comments or accommodations we should know about?
                      </label>
                      <textarea
                        value={recurringFormData.additionalComments}
                        onChange={(e) => handleRecurringFormChange('additionalComments', e.target.value)}
                        disabled={recurringSubmitting}
                        placeholder="Your answer"
                        rows="3"
                        style={{
                          width: '100%', padding: '12px', border: '1px solid #D1D5DB',
                          borderRadius: '8px', fontSize: '14px', resize: 'vertical',
                          fontFamily: 'inherit', opacity: recurringSubmitting ? 0.6 : 1
                        }}
                      />
                    </div>

                    {/* ── Submit Buttons ── */}
                    <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end' }}>
                      <button
                        type="button"
                        onClick={() => setShowRecurringModal(false)}
                        disabled={recurringSubmitting}
                        style={{
                          padding: '12px 24px', backgroundColor: 'white', color: '#0D7A7A',
                          border: '2px solid #0D7A7A', borderRadius: '8px', fontSize: '14px',
                          fontWeight: 'bold', cursor: recurringSubmitting ? 'not-allowed' : 'pointer',
                          opacity: recurringSubmitting ? 0.5 : 1, transition: 'all 0.2s'
                        }}
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        disabled={recurringSubmitting || recurringFormData.selectedSessions.length === 0}
                        style={{
                          padding: '12px 24px',
                          backgroundColor: (recurringSubmitting || recurringFormData.selectedSessions.length === 0) ? '#9CA3AF' : '#0D7A7A',
                          color: 'white', border: 'none', borderRadius: '8px',
                          fontSize: '14px', fontWeight: 'bold', transition: 'all 0.2s',
                          cursor: (recurringSubmitting || recurringFormData.selectedSessions.length === 0) ? 'not-allowed' : 'pointer'
                        }}
                      >
                        {recurringSubmitting ? 'Submitting...' : 'Submit'}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
          {/* ───────────────────────────────────────────────────────────────── */}

          {/* ── Registration Modal ──────────────────────────────────────────── */}
          {showRegistrationModal && (
            <div
              onClick={() => !regSubmitting && !regLoading && setShowRegistrationModal(false)}
              style={{
                position: 'fixed', top: 0, left: 0, width: '100%', height: '100%',
                backgroundColor: 'rgba(0, 0, 0, 0.8)', zIndex: 3000,
                display: 'flex', alignItems: 'flex-start', justifyContent: 'center',
                padding: '20px', overflowY: 'auto'
              }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                style={{
                  backgroundColor: 'white', borderRadius: '24px', padding: '32px',
                  maxWidth: '600px', width: '100%', maxHeight: '90vh', overflowY: 'auto',
                  position: 'relative', border: '3px solid #004E7C',
                  marginTop: '20px', marginBottom: '20px'
                }}
              >
                {/* Close button */}
                <button
                  onClick={() => !regSubmitting && !regLoading && setShowRegistrationModal(false)}
                  disabled={regSubmitting || regLoading}
                  style={{
                    position: 'absolute', top: '16px', right: '16px',
                    backgroundColor: 'transparent', border: 'none', color: '#004E7C',
                    cursor: (regSubmitting || regLoading) ? 'not-allowed' : 'pointer',
                    opacity: (regSubmitting || regLoading) ? 0.5 : 1, padding: '8px', fontSize: '24px'
                  }}
                >
                  <X size={24} />
                </button>

                {/* Loading state */}
                {regLoading && (
                  <div style={{ textAlign: 'center', padding: '40px' }}>
                    <p style={{ color: '#004E7C', fontWeight: '600' }}>Loading your registration...</p>

                        <select required value={regFormData.howHeard} onChange={(e) => {
                          const v = e.target.value;
                          handleRegFormChange('howHeard', v);
                          if (v !== 'Other') handleRegFormChange('howHeardOther', '');
                        }} disabled={regSubmitting}
                          style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: regSubmitting ? 0.6 : 1 }}>
                          <option value="">-- Select --</option>
                          {['Agency', 'Newspaper', 'School', 'Radio', 'Website', 'Facebook', 'Other'].map(h => (
                            <option key={h} value={h}>{h}</option>
                          ))}
                        </select>
                        {regFormData.howHeard === 'Other' && (
                          <div style={{ marginTop: '10px' }}>
                            <label style={{ display: 'block', color: '#004E7C', fontWeight: '600', marginBottom: '6px', fontSize: '13px' }}>Please specify <span style={{ color: '#DC2626' }}>*</span></label>
                            <input type="text" required value={regFormData.howHeardOther} maxLength="200"
                              onChange={(e) => handleRegFormChange('howHeardOther', e.target.value)} disabled={regSubmitting}
                              placeholder="Tell us how you heard about us"
                              style={{ width: '100%', padding: '10px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: regSubmitting ? 0.6 : 1 }} />
                          </div>
                        )}
                      </div>
                    </div>

                    {/* ── Accommodations ── */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#004E7C', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Accommodations Needed</label>
                      <textarea value={regFormData.accommodations} onChange={(e) => handleRegFormChange('accommodations', e.target.value)} disabled={regSubmitting}
                        placeholder="Please let us know at least 2 weeks prior to the event..." rows="3"
                        style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', fontFamily: 'inherit', resize: 'vertical', opacity: regSubmitting ? 0.6 : 1 }} />
                    </div>

                    {/* Submit */}
                    <button type="submit" disabled={regSubmitting}
                      style={{
                        width: '100%', padding: '16px',
                        background: regSubmitting ? '#9CA3AF' : 'linear-gradient(135deg, #004E7C, #0066a1)',
                        color: 'white', border: 'none', borderRadius: '12px',
                        fontWeight: 'bold', fontSize: '16px',
                        cursor: regSubmitting ? 'not-allowed' : 'pointer',
                        transition: 'transform 0.2s'
                      }}
                      onMouseOver={(e) => { if (!regSubmitting) e.currentTarget.style.transform='translateY(-2px)'; }}
                      onMouseOut={(e) => { e.currentTarget.style.transform='translateY(0)'; }}
                    >
                      {regSubmitting ? 'Submitting...' : 'Submit Registration'}
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}
          {/* ───────────────────────────────────────────────────────────────── */}

          {/* Support Our Mission */}
          <div style={{maxWidth: '480px', margin: '2rem auto', padding: '1.5rem', background: 'transparent', border: '1.5px solid rgba(0,78,124,0.28)', borderRadius: '16px', boxShadow: '0 2px 10px rgba(15,23,42,0.05)', textAlign: 'center'}}>
            <h2 style={{fontSize: '1.1rem', fontWeight: '700', color: '#004E7C', marginBottom: '0.75rem'}}>Support Our Mission</h2>
            <p style={{color: '#374151', fontSize: '0.88rem', marginBottom: '1rem', lineHeight: '1.6'}}>Your generous donation helps us empower families through information, training, and advocacy.</p>
            <a href="https://www.paypal.com/donate?hosted_button_id=F6F2DPC4D6RSA" target="_blank" rel="noopener noreferrer" style={{display: 'inline-block', background: 'linear-gradient(135deg, #FF9B21 0%, #f59e0b 100%)', color: 'white', textDecoration: 'none', padding: '12px 28px', borderRadius: '50px', fontSize: '14px', fontWeight: '700', transition: 'transform 0.2s, box-shadow 0.2s'}} onMouseOver={(e) => { e.currentTarget.style.transform='translateY(-2px)'; e.currentTarget.style.boxShadow='0 4px 12px rgba(255,155,33,0.4)'; }} onMouseOut={(e) => { e.currentTarget.style.transform='translateY(0)'; e.currentTarget.style.boxShadow='none'; }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'inline-block',verticalAlign:'middle',marginRight:'6px'}} aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>Donate Now
            </a>
          </div>

          {/* Bottom Navigation Bar */}
          <nav className="bottom-nav" role="navigation" aria-label="Main navigation">
            <a href="javascript:void(0)" className="nav-item a11y-nav-btn" aria-label="Accessibility Options" onClick={() => window.toggleA11yPanel && window.toggleA11yPanel()}>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9H15V22H13V16H11V22H9V9H3V7H21V9Z"/>
              </svg>
              <span>Access</span>
            </a>
            <a href="events.html" className="nav-item active" aria-current="page" aria-label="Events">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span>Events</span>
            </a>
            <a href="faq.html" className="nav-item nav-item-qhelp" aria-label="Q-Help">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <span>Q-Help</span>
            </a>
            <a href="volunteer.html" className="nav-item" aria-label="Volunteer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <span>Volunteer</span>
            </a>
            <a href="resources.html" className="nav-item" aria-label="Resources">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
              <span>Resources</span>
            </a>
            <a href="contact.html" className="nav-item" aria-label="Contact">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
              <span>Contact</span>
            </a>
          </nav>

          {/* Pre-fill Verification Modal (B'' OTP-by-email) */}
          {prefillModalOpen && (
            <div onClick={(e) => { if (e.target === e.currentTarget) setPrefillModalOpen(false); }} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 10001, padding: '16px' }}>
              <div style={{ background: '#fff', borderRadius: '12px', maxWidth: '420px', width: '100%', padding: '28px 24px', boxShadow: '0 12px 40px rgba(0,0,0,0.3)' }}>
                <h2 style={{ margin: '0 0 8px', color: '#004E7C', fontSize: '20px' }}>Verify it's you</h2>
                <p style={{ margin: '0 0 6px', fontSize: '14px', color: '#374151' }}>If you have an LDAH account, we just emailed a 6-digit code to:</p>
                <p style={{ margin: '0 0 16px', fontSize: '14px', color: '#0f172a', fontWeight: 700, wordBreak: 'break-all' }}>{(formData.email || '').trim()}</p>
                <p style={{ margin: '0 0 12px', fontSize: '13px', color: '#666' }}>Enter the code to pre-fill your information. Code expires in 10 minutes.</p>
                <input
                  type="text" inputMode="numeric" pattern="[0-9]*" maxLength={6}
                  placeholder="123456" autoComplete="one-time-code" value={prefillCode}
                  onChange={(e) => setPrefillCode(e.target.value.replace(/\D/g, ''))}
                  onKeyDown={(e) => { if (e.key === 'Enter') verifyPrefillCode(); }}
                  autoFocus
                  style={{ width: '100%', padding: '14px', fontSize: '24px', letterSpacing: '8px', textAlign: 'center', border: '2px solid #1a3c6e', borderRadius: '8px', fontFamily: 'Courier,monospace', marginBottom: '8px' }}
                />
                {prefillError && (
                  <div style={{ color: '#DC2626', fontSize: '13px', marginBottom: '8px' }}>{prefillError}</div>
                )}
                <div style={{ display: 'flex', gap: '10px', marginTop: '14px' }}>
                  <button type="button" onClick={() => setPrefillModalOpen(false)} style={{ flex: '0 0 auto', padding: '12px 18px', background: '#fff', color: '#666', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', fontWeight: 600, cursor: 'pointer' }}>Skip</button>
                  <button type="button" onClick={verifyPrefillCode} disabled={prefillBusy} style={{ flex: 1, padding: '12px', background: '#1a3c6e', color: '#fff', border: 'none', borderRadius: '8px', fontSize: '14px', fontWeight: 700, cursor: prefillBusy ? 'wait' : 'pointer', opacity: prefillBusy ? 0.6 : 1 }}>{prefillBusy ? 'Verifying...' : 'Verify & Pre-fill'}</button>
                </div>
                <div style={{ marginTop: '14px', fontSize: '12px', color: '#94a3b8', textAlign: 'center' }}>Didn't get it? Check spam, or <a href="javascript:void(0)" onClick={() => { setPrefillModalOpen(false); requestPrefillCode(); }} style={{ color: '#1a73e8' }}>resend</a>.</div>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<EventsApp />, document.getElementById('root'));
  </script>
  <script src="analytics-tracker.js"></script>
  <script src="accessibility.js"></script>
</body>
</html>
