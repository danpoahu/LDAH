  <style>
    /* Loading state */
    .loading-spinner { display: flex; justify-content: center; align-items: center; min-height: 60vh; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(8, 145, 178, 0.2); border-top-color: #0891B2; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .qh-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Search */
    .qh-search { position: relative; margin-bottom: 12px; }
    .qh-search > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: #94A3B8; fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
    .qh-search .st-input { padding-left: 40px; padding-right: 44px; min-height: 46px; -webkit-appearance: none; appearance: none; }
    .qh-search .st-input::-webkit-search-cancel-button { display: none; }
    .qh-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: none; color: var(--text-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; }
    .qh-count { font-size: .85rem; color: var(--text-soft); margin: 0 0 8px; }

    /* Category accordion */
    .qh-acc { background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.05); margin-bottom: 10px; overflow: hidden; border: 2px solid transparent; }
    .qh-acc.open { border-color: #22D3EE; }
    .qh-hd { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 60px; border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: var(--text-dark); }
    .qh-fi { width: 40px; height: 40px; border-radius: 10px; background: var(--sand); display: flex; align-items: center; justify-content: center; flex: none; color: var(--ocean-deep); }
    .qh-fi svg { stroke-width: 1.9; }
    .qh-hdt { flex: 1; min-width: 0; }
    .qh-name { display: block; font: 600 .98rem var(--st-font-head); line-height: 1.3; }
    .qh-meta { display: block; font-size: .8rem; color: var(--text-soft); }
    .qh-meta b { color: var(--ocean-deep); font-weight: 600; }
    .qh-cv { color: var(--ocean-deep); flex: none; display: flex; }
    .qh-body { padding: 0 10px 10px; }

    /* Question rows */
    .qh-q { display: flex; gap: 11px; align-items: flex-start; padding: 11px 10px; border-radius: 10px; cursor: pointer; border-top: 1px solid #F1F5F9; outline: none; }
    .qh-q:first-child { border-top-color: transparent; }
    .qh-q.sel { background: #ECFEFF; border-top-color: transparent; }
    .qh-q.sel + .qh-q { border-top-color: transparent; }
    .qh-q:focus-visible { box-shadow: 0 0 0 3px rgba(34,211,238,.6); }
    .qh-cb { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--ocean-deep); background: #fff; flex: none; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
    .qh-q.sel .qh-cb { background: var(--ocean-deep); }
    .qh-cb svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .qh-qtext { flex: 1; min-width: 0; }
    .qh-qtext h4 { margin: 0; font: 600 .93rem var(--st-font-head); line-height: 1.35; color: var(--text-dark); }
    .qh-qtext p { margin: 3px 0 0; font-size: .84rem; color: var(--text-soft); line-height: 1.45; }
    .qh-qcat { display: block; font: 600 .68rem var(--st-font-head); color: var(--sunset-coral); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
    .qh-flat { padding: 6px; }
    .qh-empty { text-align: center; }

    /* Fixed bar above the shell's bottom tabs */
    .qh-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--st-tabs-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 850; padding: 0 16px; pointer-events: none; }
    .qh-bar-in { max-width: 728px; margin: 0 auto; pointer-events: auto; }
    .qh-fab { width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--sunset-coral); color: #fff; font: 600 1rem var(--st-font-head); cursor: pointer; box-shadow: 0 8px 20px rgba(249,115,22,.35); }
    .qh-fab:hover { background: var(--coral-dark); }
    .qh-fab:focus-visible, .qh-barbtn:focus-visible, .qh-back:focus-visible, .qh-hd:focus-visible, .qh-act:focus-visible { outline: 3px solid var(--ocean-light); outline-offset: 2px; }
    .qh-barbtn { margin-top: 0; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .qh-bar .st-btn-secondary { background: #fff; }
    .qh-barbtn:disabled { opacity: .6; cursor: not-allowed; }
    .qh-spin { width: 16px; height: 16px; border: 3px solid rgba(8,145,178,.25); border-top-color: var(--ocean-deep); border-radius: 50%; animation: spin .8s linear infinite; }
    /* Keep the shell's round accessibility button clear of the fixed bar */
    body.st-app.qh-bar-on .st-a11y { bottom: calc(var(--st-tabs-h) + env(safe-area-inset-bottom, 0px) + 76px); }

    /* Action guide */
    .qh-guide-band { padding-top: 12px; }
    .qh-back { display: inline-flex; align-items: center; gap: 2px; min-height: 40px; margin: 0 0 4px -6px; padding: 0 8px 0 2px; border: 0; background: rgba(255,255,255,.16); color: #fff; border-radius: 10px; font: 600 .9rem var(--st-font-head); cursor: pointer; }
    .action-guide-wrapper { padding-bottom: 76px; }
    .qh-gcard { padding: 16px; }
    .qh-gcard h3 { font: 600 1.05rem var(--st-font-head); margin: 8px 0 4px; line-height: 1.35; }
    .qh-gcard .st-tag { box-shadow: none; background: #FFF7ED; }
    .qh-sum { margin: 0 0 6px; font-size: .92rem; color: var(--text-soft); line-height: 1.5; }
    .qh-steps { list-style: none; padding: 0; margin: 8px 0 0; }
    .qh-steps li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 4px; border-radius: 8px; cursor: pointer; font-size: .92rem; line-height: 1.45; outline: none; }
    .qh-steps li:focus-visible { box-shadow: 0 0 0 3px rgba(34,211,238,.6); }
    .qh-steps .checkbox-box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--ocean-deep); background: #fff; flex: none; display: flex; align-items: center; justify-content: center; }
    .qh-steps li.done .checkbox-box { background: var(--ocean-deep); }
    .qh-steps .checkbox-box svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .qh-steps .num { font: 700 .9rem var(--st-font-head); color: var(--ocean-deep); }
    .qh-steps .qh-step-t { flex: 1; color: var(--text-dark); }
    .qh-steps li.done .qh-step-t { color: var(--text-soft); text-decoration: line-through; }
    .qh-contact { margin-top: 10px; padding-top: 10px; border-top: 1px solid #F1F5F9; }
    .qh-ctext { margin: 0 0 6px; font-size: .86rem; color: var(--text-soft); overflow-wrap: anywhere; }
    .qh-acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .qh-act { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 8px 14px; border-radius: 10px; background: var(--sand-light); border: 1px solid #FDE68A; color: var(--ocean-deep) !important; text-decoration: none; font: 600 .88rem var(--st-font-head); max-width: 100%; overflow-wrap: anywhere; }
    .qh-act svg { width: 17px; height: 17px; stroke: var(--ocean-deep); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* Donate banner */
    .qh-donate { margin-top: 4px; }
    .qh-donate-btn { display: inline-block; width: auto; padding: 12px 28px; min-height: 46px; }

    const Folder = ({ size = 24, className = '' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

      </svg>
    );

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAU3CQ07bCVKlJ1qGak-150kaJEyPKldLk",
      authDomain: "ldah-932d5.firebaseapp.com",
      projectId: "ldah-932d5",
      storageBucket: "ldah-932d5.firebasestorage.app",
      messagingSenderId: "662130454003",
      appId: "1:662130454003:web:437576d5a5811ecd8df686"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();
    // Sign in anonymously so Firestore rules that require auth will allow reads
    auth.signInAnonymously().catch(err => console.error('Anonymous auth failed:', err));

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true };
      }

      componentDidCatch(error, errorInfo) {
        console.error('Error caught by error boundary:', error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="st-sec">
              <div className="st-wrap">
                <div className="st-card" style={{ textAlign: 'center', padding: '28px 18px' }}>
                  <h2 className="st-h">Something went wrong</h2>
                  <p className="st-sub">Please refresh the page to try again.</p>
                  <button onClick={() => window.location.reload()} className="st-btn st-btn-primary">Refresh Page</button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Contact field -> one-tap actions. Reads the text only; nothing is written.
    const URL_RE = /(https?:\/\/[^\s<>"')]+|www\.[^\s<>"')]+)/i;
    const EMAIL_RE = /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i;
    const PHONE_RE = /(\+?1[\s.-]?)?(\(?\d{3}\)?[\s.-]?)?\d{3}[\s.-]?\d{4}/;

    const parseContact = (raw) => {
      const text = String(raw || '').trim();
      if (!text) return null;
      const urlM = text.match(URL_RE);
      let rest = urlM ? text.replace(urlM[0], ' ') : text;
      const emailM = rest.match(EMAIL_RE);
      if (emailM) rest = rest.replace(emailM[0], ' ');
      const phoneM = rest.match(PHONE_RE);
      if (phoneM) rest = rest.replace(phoneM[0], ' ');
      let url = urlM ? urlM[0].replace(/[.,;:]+$/, '') : '';
      if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
      const phone = phoneM ? phoneM[0].trim() : '';
      return {
        text,
        url,
        email: emailM ? emailM[0] : '',
        phone,
        phoneDigits: phone ? phone.replace(/\D/g, '') : '',
        // Show the words too when the field says more than just a number/address/link
        hasWords: /[a-z]{3,}/i.test(rest) || (!urlM && !emailM && !phoneM)
      };
    };

    const linkLabel = (url) => url.replace(/^https?:\/\//i, '').replace(/\/$/, '');

    const PhoneIcon = () => (
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>

    const LinkIcon = () => (
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
    );
    const SearchIcon = () => (
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
    );
    const CheckMark = () => (
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
    );

    // One selectable question row
    const QuestionRow = ({ faq, isSelected, onToggle, categoryName }) => {
      const onKey = (e) => {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onToggle(); }
      };
      return (
        <div role="checkbox" aria-checked={isSelected} tabIndex={0} onClick={onToggle} onKeyDown={onKey} className={'qh-q' + (isSelected ? ' sel' : '')}>
          <span className="qh-cb" aria-hidden="true">{isSelected && <CheckMark />}</span>
          <div className="qh-qtext">
            {categoryName && <span className="qh-qcat">{categoryName}</span>}
            <h4>{faq.question}</h4>
            {faq.summary && (<p>{faq.summary}</p>)}
          </div>
        </div>
      );
    };

    const LDAHApp = () => {
      const [categories, setCategories] = useState([]);
      const [faqs, setFaqs] = useState([]);
      const [selected, setSelected] = useState(new Set());
      const [showGuide, setShowGuide] = useState(false);
      const [expandedCategories, setExpandedCategories] = useState(new Set());
      const [loading, setLoading] = useState(true);
      const [query, setQuery] = useState('');
      const [doneSteps, setDoneSteps] = useState(new Set());

      useEffect(() => {
        const unsubscribeCategories = db.collection('categories').onSnapshot(
          (snapshot) => {
            const cats = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })).filter(c => !c.archived);
            setCategories(cats);
            setLoading(false);
          },
          (error) => {
            console.error('Error loading categories:', error);
            setLoading(false);
          }
        );

        const unsubscribeFaqs = db.collection('faqs').onSnapshot(
          (snapshot) => {
            const faqList = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })).filter(f => !f.archived);
            setFaqs(faqList);
          },
          (error) => {
            console.error('Error loading FAQs:', error);
          }
        );

        return () => {
          unsubscribeCategories();
          unsubscribeFaqs();
        };
      }, []);

      // Lift the shell's round accessibility button above the fixed coral/print bar while it shows
      const barVisible = showGuide || selected.size > 0;
      useEffect(() => {
        document.body.classList.toggle('qh-bar-on', barVisible);
      }, [barVisible]);

      // Start each view at the top
      useEffect(() => { try { window.scrollTo(0, 0); } catch (e) {} }, [showGuide]);

      const toggleSelection = (faqId) => {
        const newSelected = new Set(selected);
        if (newSelected.has(faqId)) newSelected.delete(faqId); else newSelected.add(faqId);
        setSelected(newSelected);
      };

      const toggleCategory = (categoryId) => {
        const newExpanded = new Set();
        if (!expandedCategories.has(categoryId)) newExpanded.add(categoryId);
        setExpandedCategories(newExpanded);
      };

      const toggleStep = (key) => {
        const next = new Set(doneSteps);
        if (next.has(key)) next.delete(key); else next.add(key);
        setDoneSteps(next);
      };

      const sortedCategories = categories.slice().sort((a, b) => a.order - b.order);
      const categoryName = (id) => { const c = categories.find((x) => x.id === id); return c ? c.name : ''; };

      // Action Guide Component
      const ActionGuide = () => {
        const selectedFaqs = faqs.filter((faq) => selected.has(faq.id));
        const [isPrinting, setIsPrinting] = useState(false);

        const handlePrint = () => {
          setIsPrinting(true);

          const cleanup = (iframe) => {
            try { if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe); } catch {}
            setIsPrinting(false);
          };

          const guideEl = document.querySelector('.print-container');
          if (!guideEl) {
            // Fallback: just use normal print
            try { window.print(); } finally { setIsPrinting(false); }
            return;
          }

          const html = `<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Action Guide</title>
  <style>
    @page { margin: 0.5in; }
    * { background: white !important; box-shadow: none !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; color: #111827; }
    h1,h2,h3 { color: #111827; margin: 0 0 12px; }
    .section { padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; margin-bottom: 16px; }
    .section:last-child { border: 0; margin-bottom: 0; padding-bottom: 0; }
    .checkbox-box{ width:18px;height:18px;border:1px solid #0891B2;border-radius:4px;margin-top:3px;flex-shrink:0; }
    .checkbox-box svg, .qh-acts svg, .no-print { display:none !important; }
    ul{ padding-left:0; margin:0; list-style:none; }
    li{ display:flex; gap:12px; align-items:flex-start; margin:8px 0; }
    .num{ font-weight:700; color:#0891B2; }
    .st-tag{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#EA580C; }
    .qh-acts{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:8px; }
    a{ color:#0891B2; text-decoration:underline; }
    img{ display:none !important; }
    .container{ max-width: 750px; margin: 0 auto; }
    .title{ text-align:center; font-weight:700; margin: 0 0 24px; font-size: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">My Action Guide</h1>
    ${guideEl.innerHTML}
  </div>
  <script>
    // iOS sometimes defers printing until user gesture; provide a manual hook
    window.startPrint = function(){ try{ window.focus(); window.print(); }catch(e){} };
    // If the document is already ready, auto print after a tick
    if (document.readyState === 'complete') { setTimeout(window.startPrint, 50); }
    else { document.addEventListener('readystatechange', function(){ if (document.readyState === 'complete') setTimeout(window.startPrint, 50); }); }
  <\/script>
</body>
</html>`;

          const iframe = document.createElement('iframe');
          iframe.setAttribute('aria-hidden', 'true');
          iframe.style.position = 'fixed';
          iframe.style.right = '0';
          iframe.style.bottom = '0';
          iframe.style.width = '0';
          iframe.style.height = '0';
          iframe.style.border = '0';
          document.body.appendChild(iframe);

          const doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.open();
          doc.write(html);
          doc.close();

          const tryPrint = () => {
            try { iframe.contentWindow.startPrint(); } finally {
              // In desktop Safari/Chrome, afterprint fires; keep a hard fallback too
              setTimeout(() => cleanup(iframe), 1200);
            }
          };

          // Best-effort readiness checks (some browsers don't fire iframe onload after document.write)
          if (doc.readyState === 'complete') {
            setTimeout(tryPrint, 60);
          } else {
            doc.addEventListener('readystatechange', () => {
              if (doc.readyState === 'complete') setTimeout(tryPrint, 60);
            });
            // absolute fallback in case readystatechange doesn't fire
            setTimeout(tryPrint, 600);
          }

          // Also clean up after the print dialog actually closes
          try {
            iframe.contentWindow.addEventListener('afterprint', () => cleanup(iframe));
          } catch {}
        };

        // Share the guide as text where the device supports it; otherwise fall back to Print (today's behaviour)
        const handleShare = () => {
          const lines = ['My Action Guide', ''];
          selectedFaqs.forEach((faq) => {
            lines.push(faq.question);
            if (faq.summary) lines.push(faq.summary);
            (faq.steps || []).forEach((step, idx) => lines.push((idx + 1) + '. ' + step));
            if (faq.contact) lines.push('Contact: ' + String(faq.contact).trim());
            lines.push('');
          });
          lines.push('Leadership in Disabilities and Achievement of Hawaiʻi');
          const text = lines.join('\n');
          if (navigator.share) {
            navigator.share({ title: 'My Action Guide', text }).catch((err) => {
              if (!err || err.name !== 'AbortError') handlePrint();
            });
          } else {
            handlePrint();
          }
        };

        const n = selectedFaqs.length;

        return (
          <div className="action-guide-wrapper">
            <div className="st-band qh-guide-band">
              <div className="st-wrap">
                <button type="button" onClick={() => setShowGuide(false)} className="no-print qh-back">
                  <ChevronLeft size={18} />
                  Questions
                </button>
                <h1>My Action Guide</h1>
                <p>{n} {n === 1 ? 'question' : 'questions'} · tick steps as you go</p>
              </div>
            </div>

            <div className="st-sec">
              <div className="st-wrap">
                <div className="print-container">
                  {selectedFaqs.map((faq) => {
                    const c = faq.contact ? parseContact(faq.contact) : null;
                    const catName = categoryName(faq.categoryId);
                    return (
                      <div key={faq.id} className="st-card qh-gcard section">
                        {catName && <span className="st-tag">{catName}</span>}
                        <h3>{faq.question}</h3>
                        {faq.summary && <p className="qh-sum">{faq.summary}</p>}
                        {faq.steps && faq.steps.length > 0 && (
                          <ul className="qh-steps">
                            {faq.steps.map((step, idx) => {
                              const key = faq.id + ':' + idx;
                              const done = doneSteps.has(key);
                              return (
                                <li key={idx} className={done ? 'done' : ''} role="checkbox" aria-checked={done} tabIndex={0}
                                  onClick={() => toggleStep(key)}
                                  onKeyDown={(e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleStep(key); } }}>
                                  <span className="checkbox-box" aria-hidden="true">{done && <CheckMark />}</span>
                                  <span className="num">{idx + 1}.</span>
                                  <span className="qh-step-t">{step}</span>
                                </li>
                              );
                            })}
                          </ul>
                        )}
                        {c && (
                          <div className="qh-contact">
                            {c.hasWords && <p className="qh-ctext"><strong>Contact:</strong> {c.text}</p>}
                            {(c.phone || c.email || c.url) && (
                              <div className="qh-acts">
                                {c.phone && (
                                  <a className="qh-act" href={`tel:${c.phoneDigits}`}><PhoneIcon />Call {window.ldahFormatPhone ? window.ldahFormatPhone(c.phone) : c.phone}</a>
                                )}
                                {c.email && (
                                  <a className="qh-act" href={`mailto:${c.email}`}><MailIcon />Email {c.email}</a>
                                )}
                                {c.url && (
                                  <a className="qh-act" href={c.url} target="_blank" rel="noopener noreferrer"><LinkIcon />{linkLabel(c.url)}</a>
                                )}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Print / Share bar above the shell's tabs */}
            <div className="no-print qh-bar">
              <div className="st-row2 qh-bar-in">
                <button type="button" onClick={handlePrint} disabled={isPrinting} className="st-btn st-btn-secondary qh-barbtn">
                  {isPrinting ? (<><span className="qh-spin" aria-hidden="true"></span>Preparing...</>) : 'Print'}
                </button>
                <button type="button" onClick={handleShare} disabled={isPrinting} className="st-btn st-btn-primary qh-barbtn">
                  <Share size={18} />
                  Share
                </button>
              </div>
            </div>
          </div>
        );
      };

      if (showGuide) return <ActionGuide />;

      if (loading) {
        return (
          <div className="loading-spinner" role="status" aria-live="polite">
            <div className="spinner"></div>
            <span className="qh-sr">Loading</span>
          </div>
        );
      }

      const visibleCategories = sortedCategories.filter((category) => faqs.some((f) => f.categoryId === category.id));
      const visibleCatIds = new Set(visibleCategories.map((c) => c.id));
      const q = query.trim().toLowerCase();
      const catOrder = (id) => { const i = visibleCategories.findIndex((c) => c.id === id); return i < 0 ? 999 : i; };
      const results = q
        ? faqs
            .filter((f) => visibleCatIds.has(f.categoryId))
            .filter((f) => ((f.question || '') + ' ' + (f.summary || '')).toLowerCase().includes(q))
            .sort((a, b) => (catOrder(a.categoryId) - catOrder(b.categoryId)) || (a.order - b.order))
        : [];

      // Main FAQ Selection View with Accordion
      return (
        <div>
          <div className="st-band">
            <div className="st-wrap">
              <h1>Quick Help</h1>
              <p>Pick your questions and we'll build your personal action guide.</p>
            </div>
          </div>

          <div className="st-sec">
            <div className="st-wrap">
              {/* Search */}
              <div className="qh-search">
                <SearchIcon />
                <input type="search" className="st-input" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search questions" aria-label="Search questions" autoComplete="off" enterKeyHint="search" />
                {query && (
                  <button type="button" className="qh-clear" onClick={() => setQuery('')} aria-label="Clear search"><X size={18} /></button>
                )}
              </div>

              {q ? (
                <div className="qh-results">
                  <p className="qh-count" aria-live="polite">{results.length} {results.length === 1 ? 'question matches' : 'questions match'} “{query.trim()}”</p>
                  {results.length === 0 ? (
                    <div className="st-card qh-empty"><p>No questions match. Try a different word, or clear the search to browse by topic.</p></div>
                  ) : (
                    <div className="st-card qh-flat">
                      {results.map((faq) => (
                        <QuestionRow key={faq.id} faq={faq} isSelected={selected.has(faq.id)} onToggle={() => toggleSelection(faq.id)} categoryName={categoryName(faq.categoryId)} />
                      ))}
                    </div>
                  )}
                </div>
              ) : (
                <div>
                  {categories.length === 0 ? (
                    <div className="st-card qh-empty"><p>No questions are available right now.</p></div>
                  ) : (
                    visibleCategories.map((category) => {
                      const categoryFaqs = faqs.filter((f) => f.categoryId === category.id).sort((a, b) => a.order - b.order);
                      const isExpanded = expandedCategories.has(category.id);
                      const selectedInCategory = categoryFaqs.filter((f) => selected.has(f.id)).length;

                      return (
                        <div key={category.id} className={'qh-acc' + (isExpanded ? ' open' : '')}>
                          <button type="button" className="qh-hd" onClick={() => toggleCategory(category.id)} aria-expanded={isExpanded}>
                            <span className="qh-fi"><Folder size={18} /></span>
                            <span className="qh-hdt">
                              <span className="qh-name">{category.name}</span>
                              <span className="qh-meta">{categoryFaqs.length} {categoryFaqs.length === 1 ? 'question' : 'questions'}{selectedInCategory > 0 && (<b> · {selectedInCategory} selected</b>)}</span>
                            </span>
                            <span className="qh-cv">{isExpanded ? <ChevronDown size={20} /> : <ChevronRight size={20} />}</span>
                          </button>

                          {isExpanded && (
                            <div className="qh-body">
                              {categoryFaqs.map((faq) => (
                                <QuestionRow key={faq.id} faq={faq} isSelected={selected.has(faq.id)} onToggle={() => toggleSelection(faq.id)} />
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })
                  )}
                </div>
              )}
            </div>
          </div>

          {/* Support Our Mission */}
          <div className="st-coral qh-donate">
            <div className="st-wrap">
              <h2>Support Our Mission</h2>
              <p>Your generous donation helps us empower families through information, training, and advocacy.</p>
              <a href="https://www.paypal.com/donate?hosted_button_id=F6F2DPC4D6RSA" target="_blank" rel="noopener noreferrer" className="st-btn st-btn-white qh-donate-btn">Donate Now</a>
            </div>
          </div>

          {/* Spacer so the fixed button never covers the last card */}
          {selected.size > 0 && <div style={{ height: '76px' }} />}

          {/* Fixed coral button above the shell's tabs */}
          {selected.size > 0 && (
            <div className="qh-bar">
              <div className="qh-bar-in">
                <button type="button" onClick={() => setShowGuide(true)} className="qh-fab">Create My Action Guide ({selected.size}) →</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(
      <ErrorBoundary>
        <LDAHApp />
      </ErrorBoundary>,
      document.getElementById('root')
    );
  </script>
  <script src="analytics-tracker.js"></script>
  <script src="accessibility.js"></script>
</body>
</html>
