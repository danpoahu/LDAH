                ) : (
                  <button type="button" key={it.key} className="st-list ev-cal-row" onClick={() => setSelectedEvent(it.event)}>
                    <span className="st-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></span>
                    <span className="ev-cal-txt"><h4>{it.title}</h4>{it.sub && <p>{it.sub}</p>}</span>
                    <span className="st-chev" aria-hidden="true">›</span>
                  </button>
                ))}
              </div>
            )}
            {!dayItems && <p className="st-sub" style={{ textAlign: 'center' }}>Tap a day to see its events.</p>}
          </>
        );
      };

      // Sign-up offers in the detail sheet: from Upcoming exactly as before;
      // from Calendar only for an event that is in the Upcoming list itself
      // (a past or not-yet-listed date on the grid never opens a sign-up).
      const selectedIsListedCurrent = !!(selectedEvent && currentEvents.some(c => c.id === selectedEvent.id));
      const detailOffersSignup = !isPastEvents && (view !== 'calendar' || selectedIsListedCurrent);
      const _safeExtUrl = (u) => (typeof u === 'string' && /^https?:\/\//i.test(u.trim())) ? u.trim() : '';
      // Card chip date read from the ISO day at local midnight, so it never
      // slides to the previous day the way new Date('YYYY-MM-DD') does.
      const _chipDate = (iso) => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
      const _isPdf = (u) => typeof u === 'string' && /\.pdf(\?|$)/i.test(u.split('#')[0]);

      const PinIcon = () => (
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      );

      if (loading) {
        return (
          <div className="ev-page">
            <div className="st-band"><div className="st-wrap"><h1>Events &amp; Workshops</h1><p>Workshops, training sessions and community events.</p></div></div>
            <div className="loading-spinner" role="status" aria-label="Loading events"><div className="spinner"></div></div>
          </div>
        );
      }

      return (
        <div className="ev-page">
          <div className="st-band"><div className="st-wrap"><h1>Events &amp; Workshops</h1><p>Workshops, training sessions and community events.</p></div></div>

          <div className="st-sec"><div className="st-wrap">
            <div className="st-seg" role="tablist" aria-label="Events view">
              {[['upcoming', 'Upcoming'], ['calendar', 'Calendar'], ['past', 'Past']].map(([k, lbl]) => (
                <button type="button" key={k} role="tab" aria-selected={view === k} className={view === k ? 'on' : ''} onClick={() => setView(k)}>{lbl}</button>
              ))}
            </div>

            {view === 'calendar' ? renderCalendar() : (activeEvents.length > 0 ? (() => {
                  let lastMonth = '';
                  const out = [];
                  activeEvents.forEach((event, _idx) => {
                    // A one-time flyer is flagged infoOnly; a recurring one is
                    // flyerOnly. Only the recurring flag was checked here, so a
                    // one-time flyer that still carried stale signupDates (e.g.
                    // Village Hui) fell through and rendered a Sign Up button.
                    // The website gates on infoOnly — match it.
                    const isFlyer = !!event._isFlyerOnly || event.infoOnly === true;
                    const isRecurring = !!event._isRecurring && !isFlyer;
                    // Screening / Outreach Booth (specialEvent) are staffed tables — you
                    // sign up at the table on the day via the QR form, never in advance.
                    // They can still carry signupDates for scheduling, which is why the
                    // date check alone was offering a signup sheet nobody could use.
                    const isSpecial = event.specialEvent === true;
                    const _accepts = !isFlyer && !isSpecial && (isRecurring || (event.signupDates && event.signupDates.length > 0));

                    // Month-grouping anchor for this event
                    let anchorIso = null;
                    if (isRecurring) anchorIso = evToIso(event._nextDate);
                    else if (event.signupDates && event.signupDates.length > 0) anchorIso = evToIso(event.signupDates[0], event.eventDate);
                    else if (event.eventDate) anchorIso = evToIso(event.eventDate);
                    const monthLbl = evMonthLabel(anchorIso);
                    if (monthLbl && monthLbl !== lastMonth) {
                      lastMonth = monthLbl;
                      out.push(
                        <h2 className="ev-month" key={'m-' + _idx}>{monthLbl}</h2>
                      );
                    }

                    // Build the rows for this event card
                    const rows = [];
                    if (isRecurring && Array.isArray(event.schedules) && event.schedules.length > 0) {
                      event.schedules.forEach((sch, _si) => {
                        const line = formatScheduleLine(sch);
                        if (!line) return;
                        let mo = 'EVERY';
                        if (sch.frequency !== 'weekly') mo = ORDINAL_ABBR[sch.weekOfMonth] || 'EACH';
                        rows.push({
                          key: 'r' + _si,
                          tileClass: 'ev-ong',
                          tileMo: mo,
                          tileDy: DOW_ABBR[sch.dayOfWeek] || '',
                          title: event.title,
                          sessLabel: line.when,
                          timeText: line.time || '',
                          whereText: line.where || '',
                          virtual: evLooksVirtual(line.where),
                          expired: false,
                          signup: () => handleRecurringSignupClick(event)
                        });
                      });
                    } else if (!isFlyer && Array.isArray(event.signupDates) && event.signupDates.length > 0) {
                      event.signupDates.forEach((ds, _di) => {
                        const row = formatSignupDateRow(ds, event.eventDate);
                        const tile = evTileFromIso(evToIso(ds, event.eventDate));
                        const label = evSessionLabel(ds);
                        rows.push({
                          key: 'r' + _di,
                          tileClass: '',
                          tileMo: tile ? tile.mo : '',
                          tileDy: tile ? tile.dy : '•',
                          title: label ? (event.title + ' · ' + label) : event.title,
                          sessLabel: label || (row ? row.when : ds),
                          whenText: row ? row.when : ds,
                          timeText: (row && row.time) ? row.time : (row ? row.when : ds),
                          timeOnly: (row && row.time) ? row.time : '',
                          whereText: '',
                          virtual: evLooksVirtual(ds),
                          expired: row ? row.expired : false,
                          signup: () => handleSignupClick(event)
                        });
                      });
                    } else if (isFlyer) {
                      rows.push({
                        key: 'rf',
                        tileClass: 'ev-flyer',
                        tileMo: 'INFO',
                        tileDy: 'Flyer',
                        title: event.title,
                        whenText: evToIso(event.eventDate) ? _chipDate(evToIso(event.eventDate)) : 'Information',
                        timeText: event.eventDate ? formatDate(event.eventDate) : '',
                        whereText: '',
                        virtual: false,
                        expired: false,
                        signup: null
                      });
                    } else if (event.eventDate) {
                      const tile = evTileFromIso(evToIso(event.eventDate));
                      rows.push({
                        key: 'rd',
                        tileClass: '',
                        tileMo: tile ? tile.mo : '',
                        tileDy: tile ? tile.dy : '•',
                        title: event.title,
                        whenText: _chipDate(evToIso(event.eventDate)) || formatDate(event.eventDate),
                        timeText: formatDate(event.eventDate),
                        whereText: '',
                        virtual: false,
                        expired: false,
                        signup: null
                      });
                    }
                    if (rows.length === 0) return;

                    // Card chrome (website style): flyer on top, date chip,
                    // Upcoming / Ongoing badge, title, location pin line.
                    const canSign = (r) => !isPastEvents && _accepts && r.signup && !r.expired;
                    const liveRow = rows.find(r => !r.expired) || rows[0];
                    let chip;
                    if (isRecurring) {
                      const nx = evToIso(event._nextDate);
                      chip = nx ? 'Next: ' + new Date(nx + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : 'Ongoing program';
                    } else {
                      chip = [liveRow.whenText, liveRow.timeOnly].filter(Boolean).join(' · ') || liveRow.timeText || '';
                    }
                    const badge = isPastEvents ? ['Completed', 'st-badge ev-badge-past']
                      : (isRecurring ? ['Ongoing', 'st-badge st-badge-on'] : ['Upcoming', 'st-badge st-badge-up']);
                    const whereLine = event.location || (rows.length === 1 ? rows[0].whereText : '') || '';
                    const anyVirtual = rows.some(r => r.virtual);
                    const showImg = !!event.imageUrl && !_isPdf(event.imageUrl);
                    const single = rows.length === 1;

                    out.push(
                      <article className={'ev-card' + (isPastEvents ? ' ev-past' : '')} key={event.id || _idx}>
                        {showImg && (
                          <button type="button" className="ev-img" onClick={() => setSelectedEvent(event)} aria-label={'View flyer and details: ' + (event.title || 'event')}>
                            <img src={event.imageUrl} alt="" loading="lazy" onError={(e) => { e.currentTarget.parentNode.style.display = 'none'; }} />
                          </button>
                        )}
                        <div className="ev-in">
                          <div className="ev-meta">
                            {chip && <span className="st-chip">{chip}</span>}
                            <span className={badge[1]}>{badge[0]}</span>
                          </div>
                          <h3 className="ev-title" onClick={() => setSelectedEvent(event)}>{event.title}</h3>
                          {(whereLine || anyVirtual) && (
                            <div className="ev-loc"><PinIcon />{whereLine || 'Online'}{anyVirtual && <span className="ev-vpill">Virtual</span>}</div>
                          )}
                          {!single && (
                            <ul className="ev-sess">
                              {rows.map((r) => (
                                <li className={'ev-srow' + (r.expired ? ' ev-expired' : '')} key={r.key}>
                                  <span className={'ev-sdate ' + r.tileClass}><b>{r.tileMo}</b>{r.tileDy}</span>
                                  <span className="ev-stext" onClick={() => setSelectedEvent(event)}>
                                    <strong>{r.sessLabel || r.title}</strong>
                                    {[r.timeText !== r.sessLabel ? r.timeText : '', isRecurring ? r.whereText : ''].filter(Boolean).join(' · ')}
                                  </span>
                                  {canSign(r) && (
                                    <button type="button" className="ev-signup" onClick={(e) => { e.stopPropagation(); r.signup(); }}>Sign Up</button>
                                  )}
                                </li>
                              ))}
                            </ul>
                          )}
                          {single && rows[0].expired && (
                            <div className="ev-loc ev-expired-note">{rows[0].timeText} (date has passed)</div>
                          )}
                          {single && canSign(rows[0]) && (
                            <button type="button" className="st-btn st-btn-primary" onClick={(e) => { e.stopPropagation(); rows[0].signup(); }}>Sign Up</button>
                          )}
                          {isSpecial && !isPastEvents && (
                            <p className="ev-inperson">Sign up in person at the event table.</p>
                          )}
                          <button type="button" className="ev-more" onClick={() => setSelectedEvent(event)}>{event.imageUrl ? 'View flyer and details' : 'View details'} ›</button>
                        </div>
                      </article>
                    );
                  });
                  return <div className="ev-list">{out}</div>;
                })() : (
                  <div className="st-card ev-empty">
                    <Calendar size={40} className="ev-empty-ic" />
                    <h3>{isPastEvents ? 'No past events to show.' : 'No events scheduled at this time.'}</h3>
                    <p>{isPastEvents ? 'Recent events appear here after they take place.' : 'Check back soon for upcoming events.'}</p>
                  </div>
                ))}

            {/* News and Information: flyers, booths and ongoing flyer-only programs,
                at the very bottom of Upcoming (the website shows these on its home page). */}
            {view === 'upcoming' && newsItems.length > 0 && (
              <section className="ev-news" id="news" aria-labelledby="ev-news-h">
                <h2 className="ev-month" id="ev-news-h">News and Information</h2>
                <p className="ev-news-sub">Announcements, resources, and ongoing programs.</p>
                {newsItems.map((it) => {
                  const iso = !it._ongoing ? evToIso(it.eventDate) : null;
                  const chip = iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
                  const pdf = _isPdf(it.imageUrl);
                  return (
                    <button type="button" className="ev-ncard" key={'n-' + it.id} onClick={() => setNewsFlyer(it)} aria-label={'Open flyer: ' + (it.title || 'flyer')}>
                      <span className="ev-nthumb">{pdf ? 'PDF' : <img src={it.imageUrl} alt="" loading="lazy" onError={(e) => { e.currentTarget.style.display = 'none'; }} />}</span>
                      <span className="ev-nin">
                        <span className="ev-meta">
                          {chip ? <span className="st-chip">{chip}</span> : null}
                          {it._ongoing ? <span className="st-badge st-badge-on">Ongoing</span> : <span className="st-badge ev-badge-info">Information</span>}
                        </span>
                        <span className="ev-title" style={{ display: 'block' }}>{it.title}</span>
                        {it.location ? <span className="ev-loc"><PinIcon />{it.location}</span> : null}
                      </span>
                    </button>
                  );
                })}
              </section>
            )}

            {/* Request an Event: the website's form; opens in the browser. */}
            <div className="st-card ev-request">
              <h3>Can't find what you're looking for?</h3>
              <p>Ask us to bring a workshop or training to your school, group or community.</p>
              <a className="st-btn st-btn-secondary" href="https://www.ldahawaii.org/events.html#request" target="_blank" rel="noopener noreferrer">Request an Event</a>
            </div>
          </div></div>

          {/* Support Our Mission */}
          <div className="st-coral">
            <h3>Support Our Mission</h3>
            <p>Your generous donation helps us empower families through information, training, and advocacy.</p>
            <a className="st-btn st-btn-white" href="https://www.paypal.com/donate?hosted_button_id=F6F2DPC4D6RSA" target="_blank" rel="noopener noreferrer" style={{ maxWidth: '320px', margin: '10px auto 0' }}>Donate Now</a>
          </div>

          {/* Event detail sheet */}
          {selectedEvent && (
            <div className="st-ovl" onClick={() => setSelectedEvent(null)}>
              <div className="st-sheet" role="dialog" aria-modal="true" aria-label={selectedEvent.title || 'Event details'} onClick={(e) => e.stopPropagation()}>
                <div className="st-sheet-hd">
                  <div className="st-sheet-ttl">
                    <span className="st-sheet-eyebrow">{selectedEvent._isRecurring && !selectedEvent._isFlyerOnly ? 'Ongoing program' : 'Event details'}</span>
                    <h2>{selectedEvent.title}</h2>
                  </div>
                  <button type="button" className="st-sheet-x" aria-label="Close" onClick={(e) => { e.stopPropagation(); setSelectedEvent(null); }}>
                    <X size={22} />
                  </button>
                </div>
                <div className="st-sheet-bd">
                  {selectedEvent.imageUrl && !_isPdf(selectedEvent.imageUrl) && (
                    <img className="ev-flyer" src={selectedEvent.imageUrl} alt={selectedEvent.title ? 'Flyer: ' + selectedEvent.title : 'Event flyer'} />
                  )}
                  {selectedEvent.imageUrl && _isPdf(selectedEvent.imageUrl) && (
                    <a className="st-btn st-btn-secondary" href={selectedEvent.imageUrl} target="_blank" rel="noopener noreferrer" style={{ marginBottom: '12px' }}>Open the flyer (PDF)</a>
                  )}
                  <div className="ev-facts">
                    {selectedEvent._isRecurring && Array.isArray(selectedEvent.schedules) && selectedEvent.schedules.length > 0 ? (
                      selectedEvent.schedules.map((sch, i) => {
                        const line = formatScheduleLine(sch);
                        if (!line) return null;
                        return <div key={i} className="ev-fact"><Clock size={16} /><span><strong>{line.when}</strong> · {line.time}{line.where ? ' · ' + line.where : ''}</span></div>;
                      })
                    ) : (
                      evToIso(selectedEvent.eventDate) && (
                        <div className="ev-fact"><Calendar size={16} /><span>{new Date(evToIso(selectedEvent.eventDate) + 'T00:00:00')
                          .toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</span></div>
                      )
                    )}
                    {selectedEvent.time && (
                      <div className="ev-fact"><Clock size={16} /><span>{selectedEvent.time}</span></div>
                    )}
                    {selectedEvent.location && (
                      <div className="ev-fact"><PinIcon /><span>{selectedEvent.location}</span></div>
                    )}
                  </div>
                  {selectedEvent.description && (
                    <p className="ev-desc">{convertUrlsToLinks(String(selectedEvent.description))}</p>
                  )}

                  {/* Sign Up Button */}
                  {detailOffersSignup && (
                    <>
                      {selectedEvent.infoOnly === true ? (
                        _safeExtUrl(selectedEvent.registrationUrl) ? (
                          <a className="st-btn st-btn-primary" href={_safeExtUrl(selectedEvent.registrationUrl)} target="_blank" rel="noopener noreferrer">Register Now</a>
                        ) : null
                      ) : selectedEvent.specialEvent === true ? (
                        /* Screening / Outreach Booth — signing up happens at the
                           table on the day, so offer no form here either. */
                        <div className="ev-note">
                          Sign up in person — come see us at the table.
                        </div>
                      ) : selectedEvent._isRecurring && !selectedEvent._isFlyerOnly ? (
                        /* Recurring program */
                        <button
                          type="button"
                          className="st-btn st-btn-primary ev-cta"
                          onClick={(e) => {
                            e.stopPropagation();
                            setSelectedEvent(null);
                            handleRecurringSignupClick(selectedEvent);
                          }}
                        >
                          Sign Up for a Session
                        </button>
                      ) : selectedEvent.signupDates && selectedEvent.signupDates.length > 0 ? (
                        <button
                          type="button"
                          className="st-btn st-btn-primary ev-cta"
                          onClick={(e) => {
                            e.stopPropagation();
                            setSelectedEvent(null);
                            handleSignupClick(selectedEvent);
                          }}
                        >
                          Sign Up for This Event
                        </button>
                      ) : _safeExtUrl(selectedEvent.registrationUrl) ? (
                        <a className="st-btn st-btn-primary" href={_safeExtUrl(selectedEvent.registrationUrl)} target="_blank" rel="noopener noreferrer">Register Now</a>
                      ) : (
                        <div className="ev-note">
                          Signup not yet available for this event.
                        </div>
                      )}
                    </>
                  )}
                  <button type="button" className="st-btn st-btn-secondary" onClick={(e) => { e.stopPropagation(); setSelectedEvent(null); }}>Close</button>
                </div>
              </div>
            </div>
          )}

          {/* News and Information flyer viewer: the flyer on its own, clickable
              flyerLinks spots (https only), no Sign Up. */}
          {newsFlyer && (
            <div className="st-ovl" onClick={() => setNewsFlyer(null)}>
              <div className="st-sheet" role="dialog" aria-modal="true" aria-label={newsFlyer.title || 'Flyer'} onClick={(e) => e.stopPropagation()}>
                <div className="st-sheet-hd">
                  <div className="st-sheet-ttl">
                    <span className="st-sheet-eyebrow">{newsFlyer._ongoing ? 'Ongoing' : 'News and Information'}</span>
                    <h2>{newsFlyer.title}</h2>
                  </div>
                  <button type="button" className="st-sheet-x" aria-label="Close" onClick={(e) => { e.stopPropagation(); setNewsFlyer(null); }}>
                    <X size={22} />
                  </button>
                </div>
                <div className="st-sheet-bd">
                  {_isPdf(newsFlyer.imageUrl) ? (
                    <a className="st-btn st-btn-primary" href={newsFlyer.imageUrl} target="_blank" rel="noopener noreferrer" style={{ marginBottom: '12px' }}>Open the flyer (PDF)</a>
                  ) : (
                    <div className="ev-fv-img">
                      <img src={newsFlyer.imageUrl} alt={newsFlyer.title ? 'Flyer: ' + newsFlyer.title : 'Flyer'} />
                      {(Array.isArray(newsFlyer.flyerLinks) ? newsFlyer.flyerLinks : [])
                        .filter(l => l && /^https:\/\//i.test(String(l.url || '')))
                        .map((l, i) => {
                          const pct = (v) => Math.max(0, Math.min(100, Number(v) || 0)) + '%';
                          return (
                            <a key={'s' + i} className="ev-spot" href={l.url} target="_blank" rel="noopener noreferrer"
                               aria-label={l.label || 'Open link'} title={l.label || ''}
                               style={{ left: pct(l.left), top: pct(l.top), width: pct(l.width), height: pct(l.height) }}></a>
                          );
                        })}
                    </div>
                  )}
                  <button type="button" className="st-btn st-btn-secondary" onClick={(e) => { e.stopPropagation(); setNewsFlyer(null); }}>Close</button>
                </div>
              </div>
            </div>
          )}

          {/* Signup Form Modal */}
          {showSignupModal && signupEvent && (
            <div
              className="st-ovl"
              onClick={() => !submitting && setShowSignupModal(false)}
              style={{ zIndex: 2000 }}
            >
              <div
                className="st-sheet"
                role="dialog" aria-modal="true" aria-label={'Sign up: ' + (signupEvent.title || 'event')}
                onClick={(e) => e.stopPropagation()}
              >
                <div className="st-sheet-hd">
                  <div className="st-sheet-ttl">
                    <span className="st-sheet-eyebrow">{submitSuccess ? 'Signed up' : 'Sign Up'}</span>
                    <h2>{signupEvent.title}</h2>
                  </div>
                  {/* Close Button */}
                  <button
                    type="button"
                    className="st-sheet-x"
                    aria-label="Close"
                    onClick={() => !submitting && setShowSignupModal(false)}
                    disabled={submitting}
                    style={{ cursor: submitting ? 'not-allowed' : 'pointer', opacity: submitting ? 0.5 : 1 }}
                  >
                    <X size={22} />
                  </button>
                </div>
                <div className="st-sheet-bd st-form">

                {submitSuccess ? (
                  <div style={{ textAlign: 'center', padding: '40px 20px' }}>
                    <div style={{ width: '56px', height: '56px', borderRadius: '50%', background: 'linear-gradient(135deg,#0891B2,#06B6D4)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px' }}>
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <h2 style={{ color: '#0891B2', fontSize: '24px', fontWeight: 'bold', marginBottom: '12px' }}>
                      Mahalo! You're signed up.
                    </h2>
                    {lastSignupWasInlineReg ? (
                      <React.Fragment>
                        <p style={{ color: '#666', fontSize: '16px', marginBottom: '16px' }}>
                          Your spot is confirmed. Watch your email for reminders.
                        </p>
                        <div style={{
                          background: 'rgba(8,145,178,0.08)', borderLeft: '4px solid #0891B2',
                          borderRadius: '0 8px 8px 0', padding: '14px 18px',
                          margin: '0 auto 20px', maxWidth: '440px', textAlign: 'left'
                        }}>
                          <p style={{ margin: '0 0 6px', color: '#0891B2', fontWeight: 700, fontSize: '14px' }}>Watch your email for reminders</p>
                          <p style={{ margin: 0, color: '#1E293B', fontSize: '13.5px', lineHeight: 1.5 }}>
                            We will send you a reminder <strong>3 days before</strong> your session and again <strong>on the day of the session</strong>, with the Zoom link or location and anything you may need to bring.
                          </p>
                        </div>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <p style={{ color: '#666', fontSize: '16px', marginBottom: '8px' }}>
                          One more step -- please complete your registration so we can reserve your spot.
                        </p>
                        <p style={{ color: '#555', fontSize: '14px', marginBottom: '24px' }}>
                          Please remember to register each person who will be attending.
                        </p>
                        <button
                          onClick={() => {
                            setShowSignupModal(false);
                            setSubmitSuccess(false);
                            openRegistration(lastSignupDocId, lastSignupEventId, 'event', prefillStash || undefined);
                          }}
                          type="button"
                          className="st-btn st-btn-coral ev-cta"
                        >
                          Complete Registration
                        </button>
                        <br />
                      </React.Fragment>
                    )}
                    <button
                      onClick={() => { setShowSignupModal(false); setSubmitSuccess(false); }}
                      type="button"
                      className="st-btn st-btn-secondary"
                    >
                      Done
                    </button>
                  </div>
                ) : capChecking ? (
                  <div style={{ padding: '30px 6px', textAlign: 'center' }}>
                    <div className="spinner" style={{ margin: '0 auto 12px' }}></div>
                    <p style={{ color: '#64748B', fontSize: '15px', margin: 0 }}>Checking availability&hellip;</p>
                  </div>
                ) : capFull ? (
                  /* Full: show the same notice the website shows, and no form.
                     Until 2026-08-19 the app had no capacity check at all. */
                  <div style={{ padding: '10px 6px 6px' }}>
                    <p style={{ color: '#B91C1C', fontSize: '17px', fontWeight: 600, lineHeight: 1.6, margin: '0 0 14px' }}>
                      This event is full.
                    </p>
                    <button
                      type="button"
                      className="st-btn st-btn-secondary"
                      onClick={() => setShowSignupModal(false)}
                    >
                      Close
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleSubmitSignup}>
                    <p className="st-req-note">
                      * Indicates required question
                    </p>

                    {/* Email — first field; on-blur lookup pre-fills Name + other fields (v48.1.0) */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Email Address *
                      </label>
                      <input
                        type="email"
                        required
                        autoFocus
                        value={formData.email}
                        onChange={(e) => handleFormChange('email', e.target.value)}
                        onBlur={handleEmailBlur}
                        disabled={submitting}
                        placeholder="Your answer"
                        style={{
                          width: '100%',
                          padding: '12px',
                          border: '1px solid #D1D5DB',
                          borderRadius: '8px',
                          fontSize: '14px',
                          opacity: submitting ? 0.6 : 1
                        }}
                      />
                      {/* Welcome-back banner (v48.0.0) */}
                      {emailPrefillBanner && !emailPrefillDismissed && (
                        <div style={{ marginTop: '8px', background: '#FFFBEB', border: '1px solid #FCD34D', borderRadius: '8px', padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px', fontSize: '13px', color: '#92400E' }}>
                          <span>Welcome back, {emailPrefillBanner.firstName} — we've pre-filled some fields below from your last visit. Edit anything that's changed.</span>
                          <button type="button" onClick={() => setEmailPrefillDismissed(true)}
                            style={{ background: 'none', border: 'none', color: '#92400E', cursor: 'pointer', fontWeight: 700, fontSize: '16px', lineHeight: 1, padding: '0 4px', flexShrink: 0 }}
                            aria-label="Dismiss banner"
                          >x</button>
                        </div>
                      )}
                      {prefillApplied ? (
                        <div style={{ marginTop: '6px', fontSize: '13px', color: '#16A34A', fontWeight: 700 }}>Pre-filled from your account on file. You can edit anything below.</div>
                      ) : (
                        <div style={{ marginTop: '6px', fontSize: '13px' }}>
                          <a href="javascript:void(0)" onClick={requestPrefillCode} style={{ color: '#0891B2', textDecoration: 'none', fontWeight: 600 }}>Returning family? Pre-fill from email</a>
                        </div>
                      )}
                    </div>

                    {/* Name — pre-filled by email-blur lookup for returning users */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Full Name *
                      </label>
                      <input
                        type="text"
                        required
                        value={formData.name}
                        onChange={(e) => handleFormChange('name', e.target.value)}
                        onBlur={(e) => handleFormChange('name', window.LDAHFormat ? window.LDAHFormat.formatNameSmart(e.target.value) : e.target.value)}
                        disabled={submitting}
                        placeholder="Your answer"
                        style={{
                          width: '100%',
                          padding: '12px',
                          border: '1px solid #D1D5DB',
                          borderRadius: '8px',
                          fontSize: '14px',
                          opacity: submitting ? 0.6 : 1
                        }}
                      />
                    </div>

                    {/* Registrant Type (role captured at signup, v47.11) */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        I am a... *
                      </label>
                      <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                        {/* Parent Talk Cafe is Parent/Guardian-only */}
                        {(/parent\s*talk\s*caf[eé]/i.test((signupEvent && signupEvent.title) || '') ? ['Parent/Guardian'] : ['Parent/Guardian', 'Professional', 'Student', 'Community Member']).map(opt => (
                          <label key={opt} className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: submitting ? 'not-allowed' : 'pointer' }}>
                            <input type="radio" name="oneTimeRegistrantType" value={opt} required
                              checked={formData.registrantType === opt}
                              onChange={(e) => handleFormChange('registrantType', e.target.value)}
                              disabled={submitting}
                              style={{ width: '18px', height: '18px', accentColor: '#0891B2' }}
                            />
                            <span style={{ fontSize: '14px', color: '#374151' }}>{opt}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    {/* ── Inline registration fields for non-Parent/Guardian (v48.0.0) ──
                        When role !== Parent/Guardian, we collect registration info here
                        so the signup can be immediately confirmed without a follow-up email. */}
                    {formData.registrantType && !roleNeedsRegistration(formData.registrantType) && (
                      <div style={{ background: '#FFFBEB', border: '1px solid #FEF3C7', borderRadius: '12px', padding: '18px', marginBottom: '20px' }}>
                        <h3 style={{ color: '#0891B2', fontSize: '15px', fontWeight: 'bold', marginBottom: '4px', marginTop: 0 }}>Tell us a bit more</h3>
                        <p style={{ color: '#555', fontSize: '13px', marginBottom: '16px' }}>This helps us track training impact. Your signup will be confirmed immediately.</p>

                        {/* Address */}
                        <div style={{ marginBottom: '14px' }}>
                          <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>Street Address</label>
                          <input type="text" value={formData.streetAddress}
                            onChange={(e) => handleFormChange('streetAddress', e.target.value)}
                            disabled={submitting} placeholder="Your answer"
                            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: submitting ? 0.6 : 1 }} />
                        </div>
                        <div style={{ display: 'flex', gap: '12px', marginBottom: '14px' }}>
                          <div style={{ flex: 2 }}>
                            <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>City <span style={{ color: '#DC2626' }}>*</span></label>
                            <input type="text" required value={formData.city}
                              onChange={(e) => handleFormChange('city', e.target.value)}
                              disabled={submitting} placeholder="Your answer"
                              style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: submitting ? 0.6 : 1 }} />
                          </div>
                          <div style={{ flex: 1 }}>
                            <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>Zip Code <span style={{ color: '#DC2626' }}>*</span></label>
                            <input type="text" required value={formData.zipCode}
                              onChange={(e) => handleFormChange('zipCode', e.target.value)}
                              disabled={submitting} placeholder="96XXX"
                              style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: submitting ? 0.6 : 1 }} />
                          </div>
                        </div>

                        {/* Reason for Attending */}
                        <div style={{ marginBottom: '14px' }}>
                          <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>Reason for Attending <span style={{ color: '#DC2626' }}>*</span></label>
                          <select required value={formData.reasonForAttending}
                            onChange={(e) => handleFormChange('reasonForAttending', e.target.value)}
                            disabled={submitting}
                            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: submitting ? 0.6 : 1 }}>
                            <option value="">-- Select --</option>
                            {['Parent/Guardian', 'Surrogate Parent', 'Grandparent', 'Student', 'Professional', 'Other'].map(r => (
                              <option key={r} value={r}>{r}</option>
                            ))}
                          </select>
                        </div>

                        {/* Prior Training */}
                        <div style={{ marginBottom: '14px' }}>
                          <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>Prior LDAH training in the past 12 months?</label>
                          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                            {['No', 'Yes'].map(val => (
                              <label key={val} className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '6px', cursor: submitting ? 'not-allowed' : 'pointer' }}>
                                <input type="radio" name="inlinePriorTraining" value={val}
                                  checked={formData.priorTraining === val}
                                  onChange={(e) => handleFormChange('priorTraining', e.target.value)}
                                  disabled={submitting}
                                  style={{ width: '16px', height: '16px', cursor: submitting ? 'not-allowed' : 'pointer' }} />
                                <span style={{ fontSize: '14px', color: '#374151' }}>{val}</span>
                              </label>
                            ))}
                          </div>
                          {formData.priorTraining === 'Yes' && (
                            <div style={{ marginTop: '10px', paddingLeft: '24px' }}>
                              <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '13px' }}>Date of last training</label>
                              <input type="date" value={formData.priorTrainingDate}
                                onChange={(e) => handleFormChange('priorTrainingDate', e.target.value)}
                                disabled={submitting}
                                style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: submitting ? 0.6 : 1 }} />
                            </div>
                          )}
                        </div>

                        {/* How Heard */}
                        <div style={{ marginBottom: '14px' }}>
                          <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>How did you hear about this training? <span style={{ color: '#DC2626' }}>*</span></label>
                          <select required value={formData.howHeard}
                            onChange={(e) => {
                              const v = e.target.value;
                              handleFormChange('howHeard', v);
                              if (v !== 'Other') handleFormChange('howHeardOther', '');
                            }}
                            disabled={submitting}
                            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: submitting ? 0.6 : 1 }}>
                            <option value="">-- Select --</option>
                            {['Agency', 'Newspaper', 'School', 'Radio', 'Website', 'Facebook', 'Conference', 'Doctor or therapist', 'Email', 'Friend or family', 'Other'].map(h => (
                              <option key={h} value={h}>{h}</option>
                            ))}
                          </select>
                          {formData.howHeard === 'Other' && (
                            <div style={{ marginTop: '10px' }}>
                              <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '13px' }}>Please specify <span style={{ color: '#DC2626' }}>*</span></label>
                              <input type="text" required value={formData.howHeardOther} maxLength="200"
                                onChange={(e) => handleFormChange('howHeardOther', e.target.value)}
                                disabled={submitting} placeholder="Tell us how you heard about us"
                                style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: submitting ? 0.6 : 1 }} />
                            </div>
                          )}
                        </div>

                        {/* Accommodations */}
                        <div style={{ marginBottom: '0' }}>
                          <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '14px' }}>Accommodations Needed</label>
                          <textarea value={formData.accommodations}
                            onChange={(e) => handleFormChange('accommodations', e.target.value)}
                            disabled={submitting} rows="3"
                            placeholder="Please let us know at least 2 weeks prior to the event..."
                            style={{ width: '100%', padding: '10px 12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', fontFamily: 'inherit', resize: 'vertical', opacity: submitting ? 0.6 : 1 }} />
                        </div>
                      </div>
                    )}

                    {/* Phone */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Phone Number (best to text or call) *
                      </label>
                      <input
                        type="tel"
                        required
                        value={formData.phone}
                        onChange={(e) => handlePhoneChange(e.target.value)}
                        onBlur={(e) => handleFormChange('phone', window.LDAHFormat ? window.LDAHFormat.formatPhone(e.target.value) : e.target.value)}
                        disabled={submitting}
                        placeholder="(808) 555-1234"
                        style={{
                          width: '100%',
                          padding: '12px',
                          border: '1px solid #D1D5DB',
                          borderRadius: '8px',
                          fontSize: '14px',
                          opacity: submitting ? 0.6 : 1
                        }}
                      />
                    </div>

                    {/* Second parent / guardian (optional) */}
                    <div style={{ marginBottom: '20px' }}>
                      {!showSecondParent ? (
                        <a href="#" onClick={(e) => { e.preventDefault(); setShowSecondParent(true); }} style={{ fontSize: '.9rem', color: '#0891B2', textDecoration: 'none', fontWeight: 600 }}>+ Add a second parent/guardian (optional)</a>
                      ) : (
                        <div>
                          <div style={{ fontWeight: 600, marginBottom: '6px', color: '#0891B2' }}>Second parent / guardian</div>
                          <input type="text" placeholder="First name" value={secondParent.firstName} onChange={(e) => setSecondParent(prev => ({ ...prev, firstName: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', marginBottom: '8px' }} />
                          <input type="text" placeholder="Last name" value={secondParent.lastName} onChange={(e) => setSecondParent(prev => ({ ...prev, lastName: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', marginBottom: '8px' }} />
                          <input type="email" placeholder="Email" value={secondParent.email} onChange={(e) => setSecondParent(prev => ({ ...prev, email: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px' }} />
                        </div>
                      )}
                    </div>

                    {/* Preferred Contact Method */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Preferred Method of Contact *
                      </label>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        {['Email', 'Phone call', 'Text'].map(method => (
                          <label key={method} className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: submitting ? 'not-allowed' : 'pointer' }}>
                            <input
                              type="radio"
                              name="preferredContact"
                              value={method}
                              checked={formData.preferredContact === method}
                              onChange={(e) => handleFormChange('preferredContact', e.target.value)}
                              disabled={submitting}
                              required
                              style={{ width: '18px', height: '18px', cursor: submitting ? 'not-allowed' : 'pointer' }}
                            />
                            <span style={{ fontSize: '14px', color: '#374151' }}>{method}</span>
                          </label>
                        ))}
                      </div>
                    </div>

                    {/* Select Dates — when only 1 non-expired date exists we auto-select
                        it in handleSignupClick and just display the date as a read-only
                        line so the user still sees what they signed up for. */}
                    {(() => {
                      const allDates = (signupEvent.signupDates) || [];
                      const nonExpired = allDates.filter(d => !isSignupDateExpired(d));
                      if (nonExpired.length === 1) {
                        return (
                          <div style={{ marginBottom: '20px' }}>
                            <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Event Date</label>
                            <div style={{ padding: '10px 12px', background: '#FFFBEB', borderRadius: '8px', border: '1px solid #E2E8F0', color: '#0E7490', fontWeight: '600', fontSize: '14px' }}>
                              {nonExpired[0]}
                            </div>
                          </div>
                        );
                      }
                      if (nonExpired.length === 0) return null;
                      return (
                        <div style={{ marginBottom: '20px' }}>
                          <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                            Select the dates you're available to attend *
                          </label>
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            {allDates.map((date, index) => {
                              const expired = isSignupDateExpired(date);
                              return (
                                <label key={index} className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: (submitting || expired) ? 'not-allowed' : 'pointer', opacity: expired ? 0.6 : 1 }}>
                                  <input
                                    type="checkbox"
                                    checked={formData.selectedDates.includes(date)}
                                    onChange={() => handleDateToggle(date)}
                                    disabled={submitting || expired}
                                    style={{ width: '18px', height: '18px', cursor: (submitting || expired) ? 'not-allowed' : 'pointer' }}
                                  />
                                  <span style={{ fontSize: '14px', color: '#374151', textDecoration: expired ? 'line-through' : 'none' }}>{date}</span>
                                </label>
                              );
                            })}
                          </div>
                          {formData.selectedDates.length === 0 && (
                            <p style={{ color: '#DC2626', fontSize: '12px', marginTop: '4px' }}>
                              Please select at least one date
                            </p>
                          )}
                        </div>
                      );
                    })()}

                    {/* Custom Questions */}
                    {signupEvent.customQuestions && signupEvent.customQuestions.length > 0 && (
                      <>
                        {signupEvent.customQuestions.map((question, index) => (
                          <div key={index} style={{ marginBottom: '20px' }}>
                            <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px', lineHeight: '1.6' }}>
                              {convertUrlsToLinks(question)}
                            </label>
                            <textarea
                              value={formData.customAnswers[question] || ''}
                              onChange={(e) => setFormData(prev => ({
                                ...prev,
                                customAnswers: {
                                  ...prev.customAnswers,
                                  [question]: e.target.value
                                }
                              }))}
                              disabled={submitting}
                              placeholder="Your answer"
                              rows="3"
                              style={{
                                width: '100%',
                                padding: '12px',
                                border: '1px solid #D1D5DB',
                                borderRadius: '8px',
                                fontSize: '14px',
                                resize: 'vertical',
                                fontFamily: 'inherit',
                                opacity: submitting ? 0.6 : 1
                              }}
                            />
                          </div>
                        ))}
                      </>
                    )}

                    {/* Special Accommodations */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Any additional comments or special accommodations we should know about?
                      </label>
                      <textarea
                        value={formData.additionalComments}
                        onChange={(e) => handleFormChange('additionalComments', e.target.value)}
                        disabled={submitting}
                        placeholder="Your answer"
                        rows="4"
                        style={{
                          width: '100%',
                          padding: '12px',
                          border: '1px solid #D1D5DB',
                          borderRadius: '8px',
                          fontSize: '14px',
                          resize: 'vertical',
                          fontFamily: 'inherit',
                          opacity: submitting ? 0.6 : 1
                        }}
                      />
                    </div>

                    {/* Participation Type — hidden when showGroupField is explicitly false */}
                    {signupEvent.showGroupField !== false && (
                      <div style={{ marginBottom: '20px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                          Are you attending on your own, or with others? *
                        </label>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          {[['Individual', 'Just me'], ['Group', 'Me and others']].map(([type, optLabel]) => (
                            <label key={type} className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: submitting ? 'not-allowed' : 'pointer' }}>
                              <input
                                type="radio"
                                name="participationType"
                                value={type}
                                checked={(formData.participationType || 'Group') === type}
                                onChange={(e) => handleFormChange('participationType', e.target.value)}
                                disabled={submitting}
                                required
                                style={{ width: '18px', height: '18px', cursor: submitting ? 'not-allowed' : 'pointer' }}
                              />
                              <span style={{ fontSize: '14px', color: '#374151' }}>{optLabel}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Participant count (conditional) — mirrors the website: the
                        count only, no group name. Default to Group so this shows
                        before the radios have been touched, same as W2. */}
                    {signupEvent.showGroupField !== false && (formData.participationType || 'Group') === 'Group' && (
                      <div style={{ marginBottom: '20px', paddingLeft: '26px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                          How many participants? *
                        </label>
                        <input
                          type="number"
                          required
                          min="1"
                          step="1"
                          value={formData.groupSize}
                          onChange={(e) => handleFormChange('groupSize', e.target.value)}
                          disabled={submitting}
                          placeholder="# of participants"
                          style={{
                            width: '100%',
                            padding: '12px',
                            border: '1px solid #D1D5DB',
                            borderRadius: '8px',
                            fontSize: '14px',
                            opacity: submitting ? 0.6 : 1
                          }}
                        />
                      </div>
                    )}

                    {/* Submit Buttons */}
                    <div className="st-actions" style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end' }}>
                      <button
                        type="button"
                        onClick={() => setShowSignupModal(false)}
                        disabled={submitting}
                        style={{
                          padding: '12px 24px',
                          backgroundColor: 'white',
                          color: '#0891B2',
                          border: '2px solid #0891B2',
                          borderRadius: '8px',
                          fontSize: '14px',
                          fontWeight: 'bold',
                          cursor: submitting ? 'not-allowed' : 'pointer',
                          opacity: submitting ? 0.5 : 1,
                          transition: 'all 0.2s'
                        }}
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        disabled={submitting || formData.selectedDates.length === 0}
                        style={{
                          padding: '12px 24px',
                          backgroundColor: (submitting || formData.selectedDates.length === 0) ? '#9CA3AF' : '#0891B2',
                          color: 'white',
                          border: 'none',
                          borderRadius: '8px',
                          fontSize: '14px',
                          fontWeight: 'bold',
                          cursor: (submitting || formData.selectedDates.length === 0) ? 'not-allowed' : 'pointer',
                          transition: 'all 0.2s'
                        }}
                      >
                        {submitting ? 'Submitting...' : 'Submit'}
                      </button>
                    </div>
                  </form>
                )}
                </div>
              </div>
            </div>
          )}

          {/* ── Recurring Program Signup Modal ──────────────────────────────── */}
          {showRecurringModal && recurringSignupEvent && (

                      ) : (

                          <input type="text" placeholder="Last name" value={secondParent.lastName} onChange={(e) => setSecondParent(prev => ({ ...prev, lastName: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', marginBottom: '8px' }} />
                          <input type="email" placeholder="Email" value={secondParent.email} onChange={(e) => setSecondParent(prev => ({ ...prev, email: e.target.value }))} style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px' }} />

                      {/* Date of Birth — three selects (mobile-friendly; iOS scroll wheel
                          is painful 10+ years back). Combined into YYYY-MM-DD on every change
                          so recurringFormData.dob stays the canonical value. */}
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '6px', fontSize: '13px' }}>
                          Date of Birth *
                        </label>
                        {(() => {
                          // Each dropdown is bound to its OWN state field so a
                          // partial selection persists; dob (YYYY-MM-DD) is
                          // recomputed when all three are set + valid. Falls
                          // back to splitting a prefilled dob on first render.
                          const dobStr = recurringFormData.dob || '';
                          const mV = recurringFormData.dobMonth || dobStr.split('-')[1] || '';
                          const dV = recurringFormData.dobDay   || dobStr.split('-')[2] || '';
                          const yV = recurringFormData.dobYear  || dobStr.split('-')[0] || '';
                          const setPart = (field, val) => {
                            setRecurringFormData(prev => {
                              const next = { ...prev, [field]: val };
                              const m = next.dobMonth, d = next.dobDay, y = next.dobYear;
                              let iso = '';
                              if (m && d && y) {
                                const cand = y + '-' + m + '-' + d;
                                const dt = new Date(cand + 'T12:00:00Z');
                                if (!isNaN(dt.getTime()) &&
                                    dt.getUTCFullYear() === parseInt(y, 10) &&
                                    dt.getUTCMonth() === parseInt(m, 10) - 1 &&
                                    dt.getUTCDate() === parseInt(d, 10)) {
                                  iso = cand;
                                }
                              }
                              next.dob = iso;
                              return next;
                            });
                          };
                          const months = [
                            ['01','January'],['02','February'],['03','March'],['04','April'],
                            ['05','May'],['06','June'],['07','July'],['08','August'],
                            ['09','September'],['10','October'],['11','November'],['12','December']
                          ];
                          const cy = new Date().getFullYear();
                          const years = [];
                          for (let y = cy; y >= cy - 100; y--) years.push(y);
                          const days = [];
                          for (let d = 1; d <= 31; d++) days.push(d < 10 ? '0' + d : String(d));
                          const selStyle = { padding: '10px 8px', border: '1px solid #0891B2', borderRadius: '8px', fontSize: '14px', background: '#fff', minWidth: 0, boxSizing: 'border-box', opacity: recurringSubmitting ? 0.6 : 1 };
                          return (
                            <div style={{ display: 'flex', gap: '6px' }}>
                              <select required value={mV} disabled={recurringSubmitting}
                                onChange={(e) => setPart('dobMonth', e.target.value)}
                                style={{ ...selStyle, flex: 1.6 }}>
                                <option value="">Month</option>
                                {months.map(m => <option key={m[0]} value={m[0]}>{m[1]}</option>)}
                              </select>
                              <select required value={dV} disabled={recurringSubmitting}
                                onChange={(e) => setPart('dobDay', e.target.value)}
                                style={{ ...selStyle, flex: 1 }}>
                                <option value="">Day</option>
                                {days.map(d => <option key={d} value={d}>{parseInt(d, 10)}</option>)}
                              </select>
                              <select required value={yV} disabled={recurringSubmitting}
                                onChange={(e) => setPart('dobYear', e.target.value)}
                                style={{ ...selStyle, flex: 1.2 }}>
                                <option value="">Year</option>
                                {years.map(y => <option key={y} value={y}>{y}</option>)}
                              </select>
                            </div>
                          );
                        })()}
                      </div>

                      {/* Student ID */}
                      <div style={{ marginBottom: '14px' }}>

                      <div>

                        </label>
                        <input type="text" required
                          value={recurringFormData.careCoordinator}

                          style={{ width: '100%', padding: '10px', border: '1px solid #0891B2', borderRadius: '8px', fontSize: '14px', opacity: recurringSubmitting ? 0.6 : 1 }}
                        />
                      </div>
                    </div>

                    {/* ── Session Selection ── */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>
                        Select ONE session you will be attending *
                      </label>
                      {(() => {
                        const blockedMondays = (recurringFormData.email || '').trim().toLowerCase() === 'containerscapes@gmail.com';
                        // Connect-Gen (zoomMode === 'program') forces single-date selection via radio inputs
                        const isConnectGen = recurringSignupEvent.zoomMode === 'program';
                        // _occurrences items are raw {date, schedule} — read date.getDay() directly (1 = Monday)
                        const visibleOccurrences = (recurringSignupEvent._occurrences || []).filter(occ => {
                          if (!blockedMondays) return true;
                          return !occ.date || occ.date.getDay() !== 1;
                        });
                        return visibleOccurrences.map((occ, i) => {
                        const { key, display, closed } = formatOccurrence(occ);
                        const isFull = (sessionConfirmedCounts[key] || 0) >= RECURRING_SESSION_CAPACITY;
                        // Inside the 24-hour cut-off (see isRecurringSessionClosed).
                        // FULL wins the badge when a session is both.
                        const isClosed = !isFull && closed === true;
                        const isBlocked = isFull || isClosed;
                        return (
                          <label key={i} className={'st-opt st-sess' + (isFull ? ' is-full' : '') + (isClosed ? ' is-closed' : '')} style={{
                            display: 'flex', alignItems: 'flex-start', gap: '8px',
                            padding: '10px 12px', marginBottom: '8px', borderRadius: '10px',
                            background: isFull ? '#FEF2F2' : (isClosed ? '#F8FAFC' : '#fff'),
                            border: `1.5px solid ${isFull ? '#FECACA' : '#E2E8F0'}`,
                            cursor: isBlocked || recurringSubmitting ? 'not-allowed' : 'pointer',
                            opacity: isClosed ? 0.65 : 1
                          }}>
                            <input
                              type={isConnectGen ? 'radio' : 'checkbox'}
                              name={isConnectGen ? 'recurringSessionSelection' : undefined}
                              checked={recurringFormData.selectedSessions.includes(key)}
                              onChange={() => {
                                if (isConnectGen) {
                                  // Single-select: replace any prior selection
                                  setRecurringFormData(prev => ({ ...prev, selectedSessions: [key] }));
                                } else {
                                  handleSessionToggle(key);
                                }
                              }}
                              disabled={recurringSubmitting || isBlocked}
                              style={{ width: '18px', height: '18px', marginTop: '2px', flexShrink: 0, cursor: isBlocked ? 'not-allowed' : 'pointer' }}
                            />
                            <span style={{ fontSize: '14px', color: isFull ? '#B91C1C' : (isClosed ? '#64748B' : '#1E293B'), lineHeight: '1.5', textDecoration: isFull ? 'line-through' : 'none' }}>
                              {display}
                              {isFull && (
                                <span style={{ color: '#B91C1C', fontWeight: 700, fontSize: '12px', letterSpacing: '.04em', marginLeft: '6px', display: 'inline-block', textDecoration: 'none' }}>FULL</span>
                              )}
                              {isClosed && (
                                <span style={{ background: '#64748B', color: 'white', padding: '1px 8px', borderRadius: '50px', fontSize: '11px', fontWeight: 700, marginLeft: '6px' }}>Closed</span>
                              )}
                            </span>
                          </label>
                        );
                        });
                      })()}
                      {recurringSignupEvent.zoomMode !== 'program' && recurringFormData.selectedSessions.length > 1 && (
                        <div style={{
                          marginTop: '14px',
                          padding: '14px 16px',
                          background: '#FEF3C7',
                          border: '1px solid #FBBF24',
                          borderRadius: '12px'
                        }}>
                          <p style={{ margin: '0 0 8px', fontSize: '13px', color: '#78350F', fontWeight: '700', lineHeight: '1.4' }}>
                            Heads up — these sessions all cover the same content.
                          </p>
                          <p style={{ margin: '0 0 10px', fontSize: '12.5px', color: '#92400E', lineHeight: '1.45' }}>
                            You've picked <strong>{recurringFormData.selectedSessions.length}</strong> sessions. If you're signing up for more than one (for example, multiple children), please tell us why so we can plan accordingly.
                          </p>
                          <textarea
                            required
                            value={recurringFormData.multipleSessionsReason}
                            onChange={(e) => setRecurringFormData(prev => ({ ...prev, multipleSessionsReason: e.target.value }))}

                            rows={3}
                            style={{
                              width: '100%',
                              padding: '8px 10px',
                              border: '1px solid #D1D5DB',
                              borderRadius: '8px',
                              fontSize: '13px',
                              fontFamily: 'inherit',
                              resize: 'vertical',
                              boxSizing: 'border-box'
                            }}
                          />
                        </div>

                            </div>
                          </div>

                    {/* ── Submit Buttons ── */}

                      </button>

                          padding: '12px 24px',

                          fontSize: '14px', fontWeight: 'bold', transition: 'all 0.2s',
                          cursor: (recurringSubmitting || recurringFormData.selectedSessions.length === 0) ? 'not-allowed' : 'pointer'

                      </button>
                    </div>
                  </form>
                )}
                </div>
              </div>
            </div>
          )}
          {/* ───────────────────────────────────────────────────────────────── */}

          {/* ── Registration Modal ──────────────────────────────────────────── */}
          {showRegistrationModal && (
            <div

                    </div>
                    <h2 style={{ color: '#0891B2', fontSize: '24px', fontWeight: 'bold', marginBottom: '12px' }}>

                    <React.Fragment>
                    <p style={{ color: '#555', fontSize: '14px', marginTop: '16px' }}>
                      Do you have another child to register for this event?
                    </p>
                    <button
                      onClick={handleRegisterAnotherChild}
                      type="button"
                      className="st-btn st-btn-primary"
                    >
                      + Register Another Child
                    </button>
                    </React.Fragment>

                  </div>
                )}

                {/* Registration success */}
                {!regLoading && !regError && !regAlreadyCompleted && regSuccess && (
                  <div style={{ textAlign: 'center', padding: '40px' }}>
                    <div style={{ width: '56px', height: '56px', borderRadius: '50%', background: 'linear-gradient(135deg,#0891B2,#06B6D4)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px' }}>
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <h2 style={{ color: '#0891B2', fontSize: '24px', fontWeight: 'bold', marginBottom: '12px' }}>

                    <p style={{ color: '#666', fontSize: '14px', marginBottom: '16px' }}>You may now close this window.</p>

                      </p>
                      <p style={{ margin: 0, color: '#1E293B', fontSize: '13.5px', lineHeight: 1.5 }}>

                        </p>
                        <div style={{ maxHeight: '180px', overflowY: 'auto' }}>

                          </button>
                        </div>
                      </div>

                    {regSiblingApplied > 0 && (

                      </div>

                      <div style={{ background: '#FEF2F2', border: '1px solid #FECACA', borderRadius: '10px', padding: '14px', marginTop: '20px' }}>

                        </p>

                    {regFormData.role === 'Parent/Guardian' && (
                    <React.Fragment>
                    <p style={{ color: '#555', fontSize: '14px', marginTop: '16px' }}>

                    </p>
                    <button
                      onClick={handleRegisterAnotherChild}
                      type="button"
                      className="st-btn st-btn-primary"
                    >
                      + Register Another Child
                    </button>
                    <br />
                    </React.Fragment>

                    <button
                      onClick={() => setShowRegistrationModal(false)}
                      type="button"
                      className="st-btn st-btn-secondary"

                    </button>
                  </div>

                {/* Registration form */}

                      <div style={{ background: '#ecfdf5', border: '1px solid #86efac', borderRadius: '10px', padding: '14px 18px', marginBottom: '20px', fontSize: '14px', color: '#166534' }}>

                      </div>
