                    {/* ── Mailing Address ── */}
                    <div style={{ background: '#FFFBEB', border: '1px solid #FEF3C7', borderRadius: '10px', padding: '18px', marginBottom: '20px' }}>
                      <h3 style={{ color: '#0891B2', fontSize: '16px', fontWeight: 'bold', marginBottom: '14px', marginTop: 0 }}>Mailing Address</h3>
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Street Address</label>
                        <input type="text" value={regFormData.streetAddress} onChange={(e) => handleRegFormChange('streetAddress', e.target.value)} disabled={regSubmitting} placeholder="Your answer"
                          style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: regSubmitting ? 0.6 : 1 }} />
                      </div>
                      <div style={{ display: 'flex', gap: '12px' }}>
                        <div style={{ flex: 2 }}>
                          <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>City <span style={{ color: '#DC2626' }}>*</span></label>
                          <input type="text" required value={regFormData.city} onChange={(e) => handleRegFormChange('city', e.target.value)} disabled={regSubmitting} placeholder="Your answer"
                            style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: regSubmitting ? 0.6 : 1 }} />
                        </div>
                        <div style={{ flex: 1 }}>
                          <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Zip Code <span style={{ color: '#DC2626' }}>*</span></label>
                          <input type="text" required value={regFormData.zipCode} onChange={(e) => handleRegFormChange('zipCode', e.target.value)} disabled={regSubmitting} placeholder="96XXX"
                            style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: regSubmitting ? 0.6 : 1 }} />
                        </div>
                      </div>
                    </div>

                    {/* ── About You ── */}
                    {/* "I am a..." removed here (v47.11) — role is captured at

                      <h3 style={{ color: '#0891B2', fontSize: '16px', fontWeight: 'bold', marginBottom: '14px', marginTop: 0 }}>About You</h3>

                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Reason for Attending <span style={{ color: '#DC2626' }}>*</span></label>
                        <select required value={regFormData.reasonForAttending} onChange={(e) => handleRegFormChange('reasonForAttending', e.target.value)} disabled={regSubmitting}
                          style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: regSubmitting ? 0.6 : 1 }}>
                          <option value="">-- Select --</option>
                          {['Parent/Guardian', 'Surrogate Parent', 'Grandparent', 'Student', 'Professional', 'Other'].map(r => (
                            <option key={r} value={r}>{r}</option>
                          ))}
                        </select>
                      </div>

                      {regFormData.role === 'Parent/Guardian' && (
                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Military Status</label>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          {/* Canonical militaryStatus values (v120.1.0): 'Not military' | 'Active Duty' | 'Veteran' | 'Reserves'

                          <label className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }}>
                            <input type="radio" name="regMilitary" value="Not military" checked={regFormData.militaryStatus === 'Not military' || regFormData.militaryStatus === 'none'}
                              onChange={(e) => handleRegFormChange('militaryStatus', e.target.value)} disabled={regSubmitting}
                              style={{ width: '18px', height: '18px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }} />
                            <span style={{ fontSize: '14px', color: '#374151' }}>Not military affiliated</span>
                          </label>
                          <label className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }}>
                            <input type="radio" name="regMilitary" value="Active Duty" checked={regFormData.militaryStatus === 'Active Duty' || regFormData.militaryStatus === 'active'}
                              onChange={(e) => handleRegFormChange('militaryStatus', e.target.value)} disabled={regSubmitting}
                              style={{ width: '18px', height: '18px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }} />
                            <span style={{ fontSize: '14px', color: '#374151' }}>Active Duty/Military Family</span>
                          </label>
                          <label className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }}>
                            <input type="radio" name="regMilitary" value="Veteran" checked={regFormData.militaryStatus === 'Veteran'}
                              onChange={(e) => handleRegFormChange('militaryStatus', e.target.value)} disabled={regSubmitting}
                              style={{ width: '18px', height: '18px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }} />
                            <span style={{ fontSize: '14px', color: '#374151' }}>Veteran</span>
                          </label>
                          <label className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }}>
                            <input type="radio" name="regMilitary" value="Reserves" checked={regFormData.militaryStatus === 'Reserves'}
                              onChange={(e) => handleRegFormChange('militaryStatus', e.target.value)} disabled={regSubmitting}
                              style={{ width: '18px', height: '18px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }} />
                            <span style={{ fontSize: '14px', color: '#374151' }}>Reserves</span>
                          </label>
                        </div>
                        {(regFormData.militaryStatus === 'Active Duty' || regFormData.militaryStatus === 'active' || regFormData.militaryStatus === 'Veteran' || regFormData.militaryStatus === 'Reserves') && (
                          <div style={{ marginTop: '10px', paddingLeft: '26px' }}>
                            <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Branch</label>
                            <select value={regFormData.militaryBranch === 'Marines' ? 'Marine Corps' : regFormData.militaryBranch} onChange={(e) => handleRegFormChange('militaryBranch', e.target.value)} disabled={regSubmitting}
                              style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: regSubmitting ? 0.6 : 1 }}>
                              <option value="">-- Select --</option>
                              {/* Canonical branch list: Marine Corps not Marines; Reserves removed (status, not branch) */}
                              {['Army', 'Marine Corps', 'Navy', 'Air Force', 'Space Force', 'Coast Guard'].map(b => (
                                <option key={b} value={b}>{b}</option>
                              ))}
                            </select>
                          </div>
                        )}
                      </div>
                      )}
                    </div>

                    {/* ── Child Information (Parent/Guardian only) ── */}
                    {regFormData.role === 'Parent/Guardian' && (
                    <div style={{ background: '#FFFBEB', border: '1px solid #FEF3C7', borderRadius: '10px', padding: '18px', marginBottom: '20px' }}>
                      <h3 style={{ color: '#0891B2', fontSize: '16px', fontWeight: 'bold', marginBottom: '6px', marginTop: 0 }}>Child Information</h3>
                      {/* Why we ask. Under the header so it covers the whole section. (2026-07-14) */}
                      <div style={{ marginBottom: '14px', fontSize: '13px', color: '#6B7280', lineHeight: 1.4 }}>* We collect this information for grant purposes only.</div>

                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Child's full name <span style={{ color: '#DC2626' }}>*</span></label>
                        <input type="text" required value={regFormData.childName} onChange={(e) => handleRegFormChange('childName', e.target.value)} disabled={regSubmitting}
                          style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: regSubmitting ? 0.6 : 1 }} />
                      </div>

                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Child's Age Range <span style={{ color: '#DC2626' }}>*</span></label>
                        {/* Canonical childAgeRange values (v120.1.0): '0-2'|'3-5'|'6-12'|'13-17'|'High School'|'Adult'
                            Visible labels stay friendly; only stored values are canonical. */}
                        <select required value={regFormData.childAgeRange} onChange={(e) => handleRegFormChange('childAgeRange', e.target.value)} disabled={regSubmitting}
                          style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: regSubmitting ? 0.6 : 1 }}>
                          <option value="">-- Select --</option>
                          <option value="0-2">Birth-2 yrs</option>
                          <option value="3-5">3-5 yrs</option>
                          <option value="6-12">6-12 yrs</option>
                          <option value="13-17">13-17 yrs</option>
                          <option value="High School">High School</option>
                          <option value="Adult">Adult (Beyond H.S.)</option>
                        </select>
                      </div>

                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Child's Gender</label>
                        {/* Canonical childGender values (v120.1.0): Female | Male | Non-binary | Prefer not to say */}
                        <select value={regFormData.childGender} onChange={(e) => handleRegFormChange('childGender', e.target.value)} disabled={regSubmitting}
                          style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: regSubmitting ? 0.6 : 1 }}>
                          <option value="">-- Select --</option>
                          <option value="Female">Female</option>
                          <option value="Male">Male</option>
                          <option value="Non-binary">Non-binary</option>
                          <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                      </div>

                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Primary Ethnicity <span style={{ color: '#DC2626' }}>*</span></label>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                          {['African American', 'Asian', 'Caucasian', 'Filipino', 'Hispanic', 'Hawaiian/Part Hawaiian', 'Pacific Islander', 'Other/2 or more'].map(eth => (
                            <label key={eth} className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }}>
                              <input type="radio" name="regEthnicity" value={eth} required checked={regFormData.ethnicity === eth}
                                onChange={(e) => handleRegFormChange('ethnicity', e.target.value)} disabled={regSubmitting}
                                style={{ width: '18px', height: '18px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }} />
                              <span style={{ fontSize: '14px', color: '#374151' }}>{eth}</span>
                            </label>
                          ))}
                        </div>
                      </div>

                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Disability Category (select all that apply) <span style={{ color: '#DC2626' }}>*</span></label>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                          {['ADD-ADHD', 'Autism Spectrum (ASD)', 'Deaf/Hard of Hearing', 'Developmental Disability', 'Emotional Disability', 'Gifted', 'Intellectual Disability', 'Multiple Disabilities', 'No IDEA Disability', 'Orthopedic (Physical)', 'Other Health Disability', 'Specific Learning Disability', 'Speech or Language', 'Suspected', 'Traumatic Brain Injury', 'Visual (incl. blindness)', 'Deaf/Blindness'].map(dis => (
                            <label key={dis} className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }}>
                              <input type="checkbox" checked={regFormData.disabilityCategories.includes(dis)}
                                onChange={() => handleDisabilityToggle(dis)} disabled={regSubmitting}
                                style={{ width: '18px', height: '18px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }} />
                              <span style={{ fontSize: '13px', color: '#374151' }}>{dis}</span>
                            </label>
                          ))}
                        </div>
                        {regDisabilityError && (
                          <p style={{ color: '#DC2626', fontSize: '12px', marginTop: '4px' }}>Please select at least one option</p>
                        )}
                      </div>
                    </div>
                    )}

                    {/* ── Training History ── */}
                    <div style={{ background: '#FFFBEB', border: '1px solid #FEF3C7', borderRadius: '10px', padding: '18px', marginBottom: '20px' }}>
                      <h3 style={{ color: '#0891B2', fontSize: '16px', fontWeight: 'bold', marginBottom: '14px', marginTop: 0 }}>Training History</h3>

                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Prior LDAH training in the past 12 months?</label>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                          <label className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }}>
                            <input type="radio" name="regPriorTraining" value="No" checked={regFormData.priorTraining === 'No'}
                              onChange={(e) => handleRegFormChange('priorTraining', e.target.value)} disabled={regSubmitting}
                              style={{ width: '18px', height: '18px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }} />
                            <span style={{ fontSize: '14px', color: '#374151' }}>No</span>
                          </label>
                          <label className="st-opt" style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }}>
                            <input type="radio" name="regPriorTraining" value="Yes" checked={regFormData.priorTraining === 'Yes'}
                              onChange={(e) => handleRegFormChange('priorTraining', e.target.value)} disabled={regSubmitting}
                              style={{ width: '18px', height: '18px', cursor: regSubmitting ? 'not-allowed' : 'pointer' }} />
                            <span style={{ fontSize: '14px', color: '#374151' }}>Yes</span>
                          </label>
                        </div>
                        {regFormData.priorTraining === 'Yes' && (
                          <div style={{ marginTop: '10px', paddingLeft: '26px' }}>
                            <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Date of last training</label>
                            <input type="date" value={regFormData.priorTrainingDate} onChange={(e) => handleRegFormChange('priorTrainingDate', e.target.value)} disabled={regSubmitting}
                              style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: regSubmitting ? 0.6 : 1 }} />
                          </div>
                        )}
                      </div>

                      <div style={{ marginBottom: '14px' }}>
                        <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>How did you hear about this training? <span style={{ color: '#DC2626' }}>*</span></label>
                        <select required value={regFormData.howHeard} onChange={(e) => {
                          const v = e.target.value;
                          handleRegFormChange('howHeard', v);
                          if (v !== 'Other') handleRegFormChange('howHeardOther', '');
                        }} disabled={regSubmitting}
                          style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', background: 'white', opacity: regSubmitting ? 0.6 : 1 }}>
                          <option value="">-- Select --</option>
                          {['Agency', 'Newspaper', 'School', 'Radio', 'Website', 'Facebook', 'Conference', 'Doctor or therapist', 'Email', 'Friend or family', 'Other'].map(h => (
                            <option key={h} value={h}>{h}</option>
                          ))}
                        </select>
                        {regFormData.howHeard === 'Other' && (
                          <div style={{ marginTop: '10px' }}>
                            <label style={{ display: 'block', color: '#0891B2', fontWeight: '600', marginBottom: '6px', fontSize: '13px' }}>Please specify <span style={{ color: '#DC2626' }}>*</span></label>
                            <input type="text" required value={regFormData.howHeardOther} maxLength="200"
                              onChange={(e) => handleRegFormChange('howHeardOther', e.target.value)} disabled={regSubmitting}
                              placeholder="Tell us how you heard about us"
                              style={{ width: '100%', padding: '10px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', opacity: regSubmitting ? 0.6 : 1 }} />
                          </div>
                        )}
                      </div>
                    </div>

                    {/* ── Accommodations ── */}
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', color: '#0891B2', fontWeight: 'bold', marginBottom: '8px', fontSize: '14px' }}>Accommodations Needed</label>
                      <textarea value={regFormData.accommodations} onChange={(e) => handleRegFormChange('accommodations', e.target.value)} disabled={regSubmitting}
                        placeholder="Please let us know at least 2 weeks prior to the event..." rows="3"
                        style={{ width: '100%', padding: '12px', border: '1px solid #D1D5DB', borderRadius: '8px', fontSize: '14px', fontFamily: 'inherit', resize: 'vertical', opacity: regSubmitting ? 0.6 : 1 }} />
                    </div>

                    {/* Submit */}
                    <button type="submit" disabled={regSubmitting}
                      className="st-btn st-btn-primary"
                      style={{
                        background: regSubmitting ? '#9CA3AF' : undefined,
                        cursor: regSubmitting ? 'not-allowed' : 'pointer'
                      }}
                    >
                      {regSubmitting ? 'Submitting...' : 'Submit Registration'}
                    </button>
                  </form>
                )}
                </div>
              </div>
            </div>
          )}
          {/* ───────────────────────────────────────────────────────────────── */}


          {/* Pre-fill Verification Modal (B'' OTP-by-email) */}
          {prefillModalOpen && (
            <div className="st-ovl" onClick={(e) => { if (e.target === e.currentTarget) setPrefillModalOpen(false); }} style={{ zIndex: 10001, alignItems: 'center' }}>
              <div className="st-sheet" role="dialog" aria-modal="true" aria-label="Verify it's you" style={{ maxWidth: '420px' }}>
                <div className="st-sheet-hd">
                  <div className="st-sheet-ttl">
                    <span className="st-sheet-eyebrow">Returning family</span>
                    <h2>Verify it's you</h2>
                  </div>
                  <button type="button" className="st-sheet-x" aria-label="Close" onClick={() => setPrefillModalOpen(false)}><X size={22} /></button>
                </div>
                <div className="st-sheet-bd">
                <p style={{ margin: '0 0 6px', fontSize: '14px', color: '#374151' }}>If you have an LDAH account, we just emailed a 6-digit code to:</p>
                <p style={{ margin: '0 0 16px', fontSize: '14px', color: '#0f172a', fontWeight: 700, wordBreak: 'break-all' }}>{(formData.email || '').trim()}</p>
                <p style={{ margin: '0 0 12px', fontSize: '13px', color: '#666' }}>Enter the code to pre-fill your information. Code expires in 10 minutes.</p>
                <input
                  type="text" inputMode="numeric" pattern="[0-9]*" maxLength={6}
                  placeholder="123456" autoComplete="one-time-code" value={prefillCode}
                  onChange={(e) => setPrefillCode(e.target.value.replace(/\D/g, ''))}
                  onKeyDown={(e) => { if (e.key === 'Enter') verifyPrefillCode(); }}
                  autoFocus
                  className="st-otp"
                  style={{ width: '100%', boxSizing: 'border-box', padding: '14px', fontSize: '26px', letterSpacing: '10px', textAlign: 'center', border: '1.5px solid #E2E8F0', borderRadius: '12px', fontFamily: "'Outfit', ui-monospace, monospace", fontWeight: 600, color: '#1E293B', marginBottom: '8px' }}
                />
                {prefillError && (
                  <div style={{ color: '#DC2626', fontSize: '13px', marginBottom: '8px' }}>{prefillError}</div>
                )}
                <div style={{ display: 'flex', gap: '10px', marginTop: '14px' }}>
                  <button type="button" className="st-btn st-btn-secondary" onClick={() => setPrefillModalOpen(false)} style={{ flex: '0 0 auto', width: 'auto', marginTop: 0, padding: '12px 18px' }}>Skip</button>
                  <button type="button" className="st-btn st-btn-primary" onClick={verifyPrefillCode} disabled={prefillBusy} style={{ flex: 1, marginTop: 0, cursor: prefillBusy ? 'wait' : 'pointer', opacity: prefillBusy ? 0.6 : 1 }}>{prefillBusy ? 'Verifying...' : 'Verify & Pre-fill'}</button>
                </div>
                <div style={{ marginTop: '14px', fontSize: '12px', color: '#94a3b8', textAlign: 'center' }}>Didn't get it? Check spam, or <a href="javascript:void(0)" onClick={() => { setPrefillModalOpen(false); requestPrefillCode(); }} style={{ color: '#0891B2' }}>resend</a>.</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<EventsApp />, document.getElementById('root'));
  </script>
  <script src="analytics-tracker.js"></script>
  <script src="accessibility.js"></script>
</body>
</html>
